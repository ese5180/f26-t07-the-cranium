# MCUboot as the bootloader, as for the course firmware. The application is
# built as a signed image for slot 0; an update goes to slot 1 and is swapped
# in on the next reset, then reverted unless the new image confirms itself.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# Without SB_CONFIG_BOOT_SIGNATURE_KEY_FILE the build signs with MCUboot's
# public development key, which is only fit for a bench. Pass your own:
#   west build ... -- -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"/path/to/key.pem\"
