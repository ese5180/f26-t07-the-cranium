# C++ engine: C++17 with the full standard library headers (<atomic>,
# <algorithm>), no exceptions or RTTI.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_FPU=y

# Audio out over I2S.
CONFIG_I2S=y

# MIDI in and LED feedback over a UART (DIN MIDI at 31250 baud).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Tracks on a FAT-formatted SD card.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=95

# Over-the-air updates: the image runs under MCUboot (sysbuild.conf) and
# confirms itself after a clean start.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
# Resets a stuck image, so that MCUboot can return to the previous one.
CONFIG_WATCHDOG=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_ASSERT=n
