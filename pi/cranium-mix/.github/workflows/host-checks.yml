name: CRANIUM Mix host checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tools/test.sh
