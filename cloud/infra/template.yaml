AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Cranium firmware console - web console, API, sign-in, firmware storage and the AWS IoT
  resources that boards and deployments use. Deployed by cloud/deploy.sh.

Parameters:
  SigningPublicKey:
    Type: String
    Description: >-
      Firmware signing PUBLIC key: base64 of the DER SubjectPublicKeyInfo, on one line.
      The console only verifies signatures with it and can never produce one.
    # The fixed part is the DER header of an uncompressed ECDSA P-256 public key, so a
    # PEM file, a private key or a key of another type is refused before anything changes.
    AllowedPattern: '^MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE[A-Za-z0-9+/]{86}==$'
    ConstraintDescription: >-
      must be the base64 DER SubjectPublicKeyInfo of an ECDSA P-256 public key, on one line
  SlotSize:
    Type: Number
    Default: 933888
    MinValue: 1
    Description: Size of the device's image slot in bytes. Larger uploads are refused.
  LoadAddress:
    Type: Number
    Default: 196608
    MinValue: 0
    Description: Address the image must be built for (196608 = 0x30000).
  UserPoolDeletionProtection:
    Type: String
    Default: INACTIVE
    AllowedValues: [ACTIVE, INACTIVE]
    Description: >-
      Deletion protection of the user pool and of the three tables. INACTIVE while the stack
      is first created, so that a failed creation can roll back. deploy.sh switches it
      to ACTIVE once the stack exists. The name is older than the tables' protection.
  IotLogLevel:
    Type: String
    Default: INFO
    AllowedValues: [ERROR, WARN, INFO, DEBUG, DISABLED]
    Description: Default level of AWS IoT logging for the whole account in this Region.
  RestrictIotLoggingTrust:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether the role AWS IoT logs with may only be assumed for this account and Region.
      Off by default: see IotLoggingRole, and "Limits" in cloud/README.md for how to try it.
  DeployedCommit:
    Type: String
    Default: unknown
    AllowedPattern: '^(unknown|[0-9a-f]{40})$'
    Description: The git commit this deployment was built from. deploy.sh sets it.
  DeployedTree:
    Type: String
    Default: unknown
    AllowedValues: [clean, dirty, unknown]
    Description: >-
      Whether the files this deployment was built from match that commit. deploy.sh sets it.
  SignInNamesCaseSensitive:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether sign-in names (e-mail addresses) are compared exactly. This is fixed when
      the user pool is created. deploy.sh sets it to false when it creates the stack; the
      default leaves a pool that was created before this parameter existed as it is.
  ConsoleDomainName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    ConstraintDescription: must be empty, or a host name in lower case
    Description: >-
      Host name to serve the console on, such as console.example.com. Empty keeps only
      the address that API Gateway assigns, which goes on working either way.
  ConsoleCertificateArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/[0-9a-f-]+$'
    ConstraintDescription: must be empty, or the ARN of a certificate in AWS Certificate Manager
    Description: >-
      Issued certificate for ConsoleDomainName, in this Region. It is requested outside
      the stack, because a stack that creates one waits for the DNS record and fails if
      that takes too long. See "A real address" in cloud/README.md.
  HomeDomainName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    ConstraintDescription: must be empty, or a host name in lower case
    Description: >-
      Host name of the public home page, such as example.com. It is served there and on
      www.<this name>. Empty means no home page: every name gets the console.
  HomeCertificateArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/[0-9a-f-]+$'
    ConstraintDescription: must be empty, or the ARN of a certificate in AWS Certificate Manager
    Description: >-
      Issued certificate for HomeDomainName and www.<that name>, in this Region. See
      "A real address" in cloud/README.md.
  CustomerDomainName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    ConstraintDescription: must be empty, or a host name in lower case
    Description: >-
      Host name of the customer website, such as example.com, with the console for admins
      under /admin. www.<this name> sends the browser there. Empty means no customer site:
      no name gets it, and no invitation goes out. See docs/customer-site.md.
  CustomerCertificateArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/[0-9a-f-]+$'
    ConstraintDescription: must be empty, or the ARN of a certificate in AWS Certificate Manager
    Description: >-
      Issued certificate for CustomerDomainName and www.<that name>, in this Region. See
      docs/customer-site.md.
  CustomerSelfSignUp:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether people may make a customer account themselves. Off: an admin invites each
      customer from the console's Customers page. The customer site has no sign-up page.
  MemfaultChunksHost:
    Type: String
    Default: chunks-nrf.memfault.com
    AllowedValues: [chunks-nrf.memfault.com, chunks.memfault.com]
    Description: >-
      Where the Memfault forwarder posts the boards' chunks (docs/memfault.md). The nRF Connect SDK's
      own Memfault port posts an nRF board to chunks-nrf, which is where a project made through nRF
      Cloud is served; chunks.memfault.com is the address of every other Memfault project.
  MemfaultOrgSlug:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9-]{0,62}$'
    ConstraintDescription: must be empty, or a Memfault organization slug in lower case
    Description: >-
      The Memfault organization's slug, for the link to a board in Memfault on its page in the
      console. Not a secret. Empty, or MemfaultProjectSlug empty, means no link.
  MemfaultProjectSlug:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9-]{0,62}$'
    ConstraintDescription: must be empty, or a Memfault project slug in lower case
    Description: >-
      The Memfault project's slug, for the same link. Not a secret.

Conditions:
  CaseInsensitiveSignIn: !Equals [!Ref SignInNamesCaseSensitive, 'false']
  HasConsoleDomain: !Not [!Equals [!Ref ConsoleDomainName, '']]
  HasHomeDomain: !Not [!Equals [!Ref HomeDomainName, '']]
  HasCustomerDomain: !Not [!Equals [!Ref CustomerDomainName, '']]
  CustomerSelfSignUpAllowed: !Equals [!Ref CustomerSelfSignUp, 'true']
  ProtectFromDeletion: !Equals [!Ref UserPoolDeletionProtection, ACTIVE]
  RestrictedIotLoggingTrust: !Equals [!Ref RestrictIotLoggingTrust, 'true']

Resources:

  # ---------------------------------------------------------------------------------
  # HTTP API: one origin for the console and its API. Every piece is its own resource;
  # the Api itself refers to nothing, so the app client can use its endpoint as the
  # callback URL without a dependency cycle.
  # ---------------------------------------------------------------------------------

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Ref AWS::StackName
      ProtocolType: HTTP

  WebIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WebFn.Arn
      PayloadFormatVersion: '2.0'

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFn.Arn
      PayloadFormatVersion: '2.0'

  Authorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      Name: cognito-access-token
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
        # An access token has no "aud"; API Gateway then checks "client_id" against this.
        Audience:
          - !Ref UserPoolClient
          - !Ref MobileUserPoolClient

  RootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'GET /'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebIntegration}'

  AssetsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'GET /assets/{proxy+}'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebIntegration}'

  # What no other route claims, HEAD and paths nobody knows among them, goes to the web
  # function, which answers from its fixed table with all its security headers. Otherwise
  # API Gateway answers with a 404 of its own that has none. It uses the default limits.
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WebIntegration}'

  # Reads and writes are separate routes only so that each has its own request limit
  # (Stage, below). Both need the same token and go to the same function, which routes
  # on the path. An HTTP API has no limit per caller, so this keeps heavy reading from
  # starving revoke and cancel, and no more than that: see "Limits" in cloud/README.md.
  # The API has no other methods, so anything else goes to the default route.
  ApiReadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'GET /api/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      AuthorizationScopes:
        - cranium/console
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiWriteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'POST /api/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      AuthorizationScopes:
        - cranium/console
      Target: !Sub 'integrations/${ApiIntegration}'

  # Personal API tokens, for scripts: /api/t/<path> is /api/<path> with "Authorization:
  # Bearer crn_..." instead of a session. The gateway cannot check such a token, so these
  # two routes have no authorizer and the function checks it: its digest must be stored,
  # unrevoked and unexpired, and Cognito is asked about its owner on every request (see
  # cloud/api/src/handlers/tokens.mjs). API Gateway picks the most specific route, so
  # nothing under /api/t/ reaches the two routes above. A request with no valid token is
  # answered 401 by the function and, like one the authorizer refuses, adds no entry to the
  # activity log; each still invokes the function, which the limits in Stage keep small.
  ApiTokenReadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'GET /api/t/{proxy+}'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiTokenWriteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'POST /api/t/{proxy+}'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApiIntegration}'

  # PUT replaces one thing that exists: a release's note (PUT /api/firmware/{version}/notes), with a
  # session or, as an upload is, with an API token (scripts/release-notes.sh). The same token, the
  # same function and the same limits as POST; the function decides which paths take it.
  ApiPutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'PUT /api/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref Authorizer
      AuthorizationScopes:
        - cranium/console
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiTokenPutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'PUT /api/t/{proxy+}'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApiIntegration}'

  # SideStore on a member's iPhone (docs/mobile-apps.md, "Updates on every phone"), which signs in to
  # nothing: /api/sidestore/<key>/source.json and /api/sidestore/<key>/cranium-ios-<version>.ipa. The key
  # in the path is the credential, a member's own, stored as its digest and checked by the function,
  # which also asks Cognito whether its owner is still a member and counts its uses (handlers/
  # sidestore.mjs). GET only, and the lowest limits of the API (Stage). The access log records the
  # route key, never the path, so the key is in no log.
  ApiSidestoreRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'GET /api/sidestore/{proxy+}'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApiIntegration}'
  # The customer site's API (docs/customer-site.md): another function, behind an authorizer of
  # its own, whose issuer is the customer pool and whose audience is the customer site's client.
  # Authorizer above keeps the staff pool and the staff clients, so neither kind of token opens the
  # other's API, at the gateway, before any code runs. The most specific route wins, so nothing
  # under /api/c/ reaches the console's routes; there is no POST, because the customer API only
  # reads, and a POST to /api/c/ meets the console's authorizer, which refuses a customer's token.
  CustomerAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      Name: cognito-customer-access-token
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CustomerUserPool}'
        # The customer site's client, and the phone apps' client of the customer pool.
        Audience:
          - !Ref CustomerUserPoolClient
          - !Ref CustomerMobileUserPoolClient

  CustomerApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CustomerApiFn.Arn
      PayloadFormatVersion: '2.0'

  # The scope is the one every access token of the user pool API carries, and no ID token does:
  # an ID token of the customer site's client is refused here.
  CustomerApiReadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: 'GET /api/c/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref CustomerAuthorizer
      AuthorizationScopes:
        - aws.cognito.signin.user.admin
      Target: !Sub 'integrations/${CustomerApiIntegration}'

  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/apigateway/${AWS::StackName}-access'
      RetentionInDays: 365

  # The console's own address. The web function takes the address it signs in with from
  # the request, so the page works on this name and on the one API Gateway assigned.
  ConsoleDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasConsoleDomain
    Properties:
      DomainName: !Ref ConsoleDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ConsoleCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ConsoleDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasConsoleDomain
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref ConsoleDomain
      Stage: !Ref Stage

  # The public home page, on a name and on www.<name>. It is the same API: the web
  # function tells the names apart by HOME_HOSTS, below. Cognito is not told about either
  # name, because the home page signs nobody in.
  HomeDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasHomeDomain
    Properties:
      DomainName: !Ref HomeDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref HomeCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  HomeDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasHomeDomain
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref HomeDomain
      Stage: !Ref Stage

  HomeWwwDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasHomeDomain
    Properties:
      DomainName: !Sub 'www.${HomeDomainName}'
      DomainNameConfigurations:
        - CertificateArn: !Ref HomeCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  HomeWwwDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasHomeDomain
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref HomeWwwDomain
      Stage: !Ref Stage

  # The customer website (docs/customer-site.md), on a name, with the console under /admin of the
  # same name for admins. www.<name> answers too, by sending the browser to the name itself: one
  # origin, so that a sign-in is kept in one place and the console's sign-in pages need one more
  # return address, not two. The web function tells the names apart by CUSTOMER_HOSTS, below.
  CustomerDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomerDomain
    Properties:
      DomainName: !Ref CustomerDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CustomerCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  CustomerDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomerDomain
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref CustomerDomain
      Stage: !Ref Stage

  CustomerWwwDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomerDomain
    Properties:
      DomainName: !Sub 'www.${CustomerDomainName}'
      DomainNameConfigurations:
        - CertificateArn: !Ref CustomerCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  CustomerWwwDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomerDomain
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref CustomerWwwDomain
      Stage: !Ref Stage

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    # RouteSettings names route keys, which API Gateway rejects until the routes exist.
    DependsOn:
      - RootRoute
      - AssetsRoute
      - ApiReadRoute
      - ApiWriteRoute
      - ApiTokenReadRoute
      - ApiTokenWriteRoute
      - ApiPutRoute
      - ApiTokenPutRoute
      - ApiSidestoreRoute
      - CustomerApiReadRoute
    Properties:
      ApiId: !Ref Api
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      # A page load is several requests at once. Both numbers are always given: a
      # missing one counts as zero and would throttle every request.
      RouteSettings:
        'GET /':
          ThrottlingBurstLimit: 60
          ThrottlingRateLimit: 20
        'GET /assets/{proxy+}':
          ThrottlingBurstLimit: 60
          ThrottlingRateLimit: 20
        # What the API as a whole had before the two routes were separated.
        'GET /api/{proxy+}':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
        # People write, one thing at a time. A refused write still adds an entry to the
        # activity log, so this number is also the most that a flood can add.
        'POST /api/{proxy+}':
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
        # Scripts with an API token: an update follows a deployment every few seconds. Kept
        # apart and below the session routes, so that a script, or a flood of requests with
        # no valid token, cannot use up what the console itself needs.
        'GET /api/t/{proxy+}':
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
        'POST /api/t/{proxy+}':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        # A release's note: a write like any other, and no more often.
        'PUT /api/{proxy+}':
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
        'PUT /api/t/{proxy+}':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        # SideStore: a source read when the app looks for updates, an IPA downloaded once a version. A
        # team's phones need little; a flood with a dead or guessed key is held to this.
        'GET /api/sidestore/{proxy+}':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
        # Customers, apart from the console's own routes, so that busy customers cannot use up
        # what release managers need, nor the other way round.
        'GET /api/c/{proxy+}':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${AccessLogGroup}'
        # The route key, never the path: a query string can carry an authorization
        # code. No headers either.
        #
        # An HTTP API has no way to escape a value in this format, and the two error
        # messages are API Gateway's own text, which can contain double quotes (the
        # message for a token signed with an unknown key does). A line with such a
        # message is not valid JSON. The two messages therefore come last: everything
        # before "integrationError" is made of values that cannot contain a quote, so
        # that part of a line can always be trusted and cut off. At most one of the
        # two is ever set, because a request that the authorizer refuses never reaches
        # the integration. Search this log with text patterns, not JSON patterns.
        Format: >-
          {"requestId":"$context.requestId",
          "requestTime":"$context.requestTime",
          "routeKey":"$context.routeKey",
          "status":"$context.status",
          "protocol":"$context.protocol",
          "sourceIp":"$context.identity.sourceIp",
          "sub":"$context.authorizer.claims.sub",
          "integrationLatency":"$context.integrationLatency",
          "responseLength":"$context.responseLength",
          "integrationError":"$context.integrationErrorMessage",
          "authorizerError":"$context.authorizer.error"}

  WebFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*'

  ApiFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*'

  CustomerApiFnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CustomerApiFn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*'

  # ---------------------------------------------------------------------------------
  # Sign-in: Cognito user pool. Users are created by an administrator (cloud/users.sh),
  # sign in with e-mail and password, and must use an authenticator app. The console has
  # a sign-in page of its own (the user pool API, with SRP and the sign-in trigger below)
  # and keeps the managed login pages for what that page does not do.
  # ---------------------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolTier: ESSENTIALS
      UsernameAttributes:
        - email
      # Without this, sign-in names are case sensitive: an address typed with a capital
      # letter is a different user. It cannot be changed once the pool exists, so it
      # follows a parameter that only a first deployment sets.
      UsernameConfiguration: !If
        - CaseInsensitiveSignIn
        - CaseSensitive: false
        - !Ref AWS::NoValue
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        # The address is in the mail so that nobody has to be told it separately. This is
        # the only mail the console sends, and the only link in it is the console's own.
        InviteMessageTemplate:
          EmailSubject: Your Cranium firmware console account
          EmailMessage: !Sub
            - >-
              <p>You have an account on the Cranium firmware console.</p>
              <p>Address: <a href="${Url}">${Url}</a><br>
              User name: {username}<br>
              Temporary password: {####}</p>
              <p>The temporary password works for 3 days. When you first sign in, you choose
              your own password and set up an authenticator app. Type your user name in
              lower case.</p>
            - Url: !If
                - HasConsoleDomain
                - !Sub 'https://${ConsoleDomainName}/'
                - !Sub '${Api.ApiEndpoint}/'
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      # Quoted: a bare ON is a YAML boolean.
      MfaConfiguration: 'ON'
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      DeletionProtection: !Ref UserPoolDeletionProtection
      # The console's own sign-in page and the phone apps' own sign-in screen sign in through
      # the user pool API, whose access tokens lack cranium/console: SignInScopeFn adds it for
      # those two clients only (see there). Version 2 is the one that may change an access token; it needs the
      # Essentials plan above. The function is named by its ARN, not with !GetAtt, because
      # it is told the client's ID, and the client belongs to this pool: a reference here
      # would make a loop that CloudFormation refuses.
      LambdaConfig:
        PreTokenGenerationConfig:
          LambdaArn: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-signin-scope'
          LambdaVersion: V2_0

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      # The prefix becomes a public host name that must be unique in the Region, so it
      # ends in the first block of this stack's id.
      Domain: !Join
        - ''
        - - cranium-
          - !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      # Without this the domain serves the classic hosted UI.
      ManagedLoginVersion: 2

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: cranium
      Name: cranium
      Scopes:
        - ScopeName: console
          ScopeDescription: Use the Cranium firmware console

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    # The scope cranium/console is refused until the resource server exists.
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      # A browser cannot keep a secret; the client uses PKCE instead.
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - cranium/console
      SupportedIdentityProviders:
        - COGNITO
      # Unset, this lets a user change their own e-mail address through the public
      # client id. That address is the sign-in name, what an administrator looks an
      # account up by, and what the activity log shows. Changing it is for an
      # administrator, whose calls are not limited by this list. The list cannot be
      # empty, so it names one attribute that nothing here reads. The pool requires no
      # attribute that a first sign-in has to write.
      WriteAttributes:
        - name
      # The console always sends the form with the trailing slash. Both are registered
      # because Cognito compares the redirect URI character by character.
      CallbackURLs:
        - !Sub '${Api.ApiEndpoint}/'
        - !GetAtt Api.ApiEndpoint
        - !If [HasConsoleDomain, !Sub 'https://${ConsoleDomainName}/', !Ref AWS::NoValue]
        - !If [HasConsoleDomain, !Sub 'https://${ConsoleDomainName}', !Ref AWS::NoValue]
        # The console as admin mode of the customer site (docs/customer-site.md).
        - !If [HasCustomerDomain, !Sub 'https://${CustomerDomainName}/admin', !Ref AWS::NoValue]
      LogoutURLs:
        - !Sub '${Api.ApiEndpoint}/'
        - !GetAtt Api.ApiEndpoint
        - !If [HasConsoleDomain, !Sub 'https://${ConsoleDomainName}/', !Ref AWS::NoValue]
        - !If [HasConsoleDomain, !Sub 'https://${ConsoleDomainName}', !Ref AWS::NoValue]
        - !If [HasCustomerDomain, !Sub 'https://${CustomerDomainName}/admin', !Ref AWS::NoValue]
      # SRP is what the console's own sign-in page uses: the password stays in the browser.
      # Never ALLOW_USER_PASSWORD_AUTH, which would send it.
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      EnableTokenRevocation: true
      # A wrong address and a wrong password get the same answer.
      PreventUserExistenceErrors: ENABLED
      # Minutes a user has for each step of signing in. The default of 3 is short for a
      # first sign-in, where an authenticator app may have to be installed first.
      AuthSessionValidity: 15
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: minutes

  # The phone apps (apps/ios, apps/android): the same accounts and the same scope as the
  # console, through the same managed login, with a redirect back into the app. A phone
  # cannot keep a secret either, so it uses PKCE. See docs/mobile-apps.md.
  MobileUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - cranium/console
      SupportedIdentityProviders:
        - COGNITO
      # As for the console's client: nothing a first sign-in has to write, and no way to
      # change the e-mail address.
      WriteAttributes:
        - name
      CallbackURLs:
        - cranium://signin
      LogoutURLs:
        - cranium://signin
      # The apps sign in on their own screen with SRP, as the console's page does, so that the
      # code goes in six boxes: the password stays on the phone. A step that screen does not
      # do (a new password, an authenticator to set up) goes to the managed login pages above,
      # with PKCE. Never ALLOW_USER_PASSWORD_AUTH, which would send the password.
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AuthSessionValidity: 15
      AccessTokenValidity: 60
      IdTokenValidity: 60
      # 30 days, for the apps' Face ID, Touch ID or fingerprint unlock (docs/mobile-apps.md): an app
      # keeps the refresh token only behind the phone's biometrics, and without them forgets it an hour
      # after the sign-in, as before. A change still needs a sign-in with password and code in the
      # last 15 minutes (auth_time), and every request checks the account live, so a removed or
      # disabled person's refresh token reads nothing.
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # Managed login serves no page for an app client that has no branding style, so
  # without this resource nobody can sign in.
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  MobileManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref MobileUserPoolClient
      UseCognitoProvidedValues: true

  ReleaseManagersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: release-managers
      Description: May upload and revoke firmware and create and cancel deployments.

  ViewersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: viewers
      Description: Read only.

  # ---------------------------------------------------------------------------------
  # Customers of the customer site (docs/customer-site.md): a user pool of their own, apart from
  # the staff pool above, so that no customer account can ever be a member of the console's
  # groups or sign in to the console. Admins invite customers from the console's Customers page
  # (AdminCreateUser), and Cognito e-mails the invitation. A customer signs in with e-mail and
  # password on the customer site's own page, with SRP; an authenticator app is the customer's
  # choice. No managed login pages, no OAuth, no trigger.
  #
  # It exists whether or not CustomerDomainName is set, so that customers and their boards can be
  # prepared before the name is pointed here. Without a name no invitation goes out (the API
  # refuses it), because the invitation would have no address to give.
  # ---------------------------------------------------------------------------------

  CustomerUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-customers'
      UserPoolTier: ESSENTIALS
      UsernameAttributes:
        - email
      # A new pool, so it can have this from the start: Ada@Example.com is ada@example.com.
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If [CustomerSelfSignUpAllowed, false, true]
        InviteMessageTemplate:
          EmailSubject: Your Cranium account
          EmailMessage: !If
            - HasCustomerDomain
            - !Sub >-
              <p>You have a Cranium account.</p>
              <p>Sign in at <a href="https://${CustomerDomainName}/">https://${CustomerDomainName}/</a><br>
              E-mail address: {username}<br>
              Temporary password: {####}</p>
              <p>The temporary password works for 7 days. When you first sign in, you choose your
              own password.</p>
            - >-
              <p>You have a Cranium account.</p>
              <p>E-mail address: {username}<br>
              Temporary password: {####}</p>
              <p>The temporary password works for 7 days.</p>
      # The code of a password reset ("Forgot your password?" on the customer site).
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Cranium code
        EmailMessage: >-
          Your Cranium code is {####}. Type it on the Cranium site to choose a new password.
          If you did not ask for it, ignore this e-mail: your password stays as it is.
      # At least 10 characters, and nothing else asked of them: length is what makes a password
      # hard to guess.
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      # An authenticator app, if the customer turns it on (the site's Account page). Quoted, like ON.
      MfaConfiguration: 'OPTIONAL'
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      # A forgotten password is reset by a code sent to the address, which an invitation verifies.
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      DeletionProtection: !Ref UserPoolDeletionProtection

  CustomerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CustomerUserPool
      ClientName: customer-site
      # A browser cannot keep a secret, and the site needs none: it signs in with SRP.
      GenerateSecret: false
      # No OAuth and no managed login pages: every step is on the site's own pages.
      AllowedOAuthFlowsUserPoolClient: false
      SupportedIdentityProviders:
        - COGNITO
      # The address is the sign-in name, and only an admin changes it. See UserPoolClient.
      WriteAttributes:
        - name
      # SRP only: the password never leaves the browser. Never ALLOW_USER_PASSWORD_AUTH.
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      EnableTokenRevocation: true
      # A wrong address and a wrong password get the same answer, and so does a reset asked for
      # an address that has no account.
      PreventUserExistenceErrors: ENABLED
      AuthSessionValidity: 15
      AccessTokenValidity: 60
      IdTokenValidity: 60
      # The site revokes the refresh token at once, as the console does, and keeps none.
      RefreshTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: minutes

  # The phone apps' customer side (docs/mobile-apps.md, "Customers"): the same accounts as the
  # customer site, signed in on the apps' own screen with SRP, as the site does. A client of its
  # own only for the refresh token's lifetime, as MobileUserPoolClient has for the staff pool: an
  # app keeps it only behind Face ID or a fingerprint, for up to 30 days, and without them forgets
  # it an hour after the sign-in. Every request to the customer API asks Cognito whether the
  # account is on, so a switched-off customer's refresh token reads nothing within a minute.
  CustomerMobileUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CustomerUserPool
      ClientName: customer-phone-apps
      # A phone cannot keep a secret either, and needs none: it signs in with SRP.
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: false
      SupportedIdentityProviders:
        - COGNITO
      WriteAttributes:
        - name
      # SRP only: the password never leaves the phone. Never ALLOW_USER_PASSWORD_AUTH.
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AuthSessionValidity: 15
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------------------------------------------------------------------------------
  # Firmware storage. Objects are firmware/<sha256 of the file>.bin, written once. The
  # Android app's APKs are here too, under apps/android/, and the iPhone app's unsigned IPAs
  # under apps/ios/ (docs/mobile-apps.md): a bucket that is already private, TLS only,
  # encrypted, versioned and kept when the stack goes. A download of one names the S3
  # version that was checked when it was published. Neither is ever public: both hold the
  # stack's console address and client IDs.
  # ---------------------------------------------------------------------------------

  FirmwareBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  FirmwareBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FirmwareBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyRequestsWithoutTls
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt FirmwareBucket.Arn
              - !Sub '${FirmwareBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          # Write-once, enforced by the bucket: an upload that does not say "only if
          # the key is new" is refused whoever sends it.
          - Sid: DenyOverwritingFirmware
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${FirmwareBucket.Arn}/firmware/*'
            Condition:
              'Null':
                s3:if-none-match: 'true'
          # A revoked image stops downloading at once, also through presigned URLs
          # that were issued before the revocation.
          - Sid: DenyDownloadingRevokedFirmware
            Effect: Deny
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub '${FirmwareBucket.Arn}/firmware/*'
            Condition:
              StringEquals:
                s3:ExistingObjectTag/revoked: 'true'

  # ---------------------------------------------------------------------------------
  # State. Deployments are not stored here: AWS IoT Jobs is their only store.
  # ---------------------------------------------------------------------------------

  # Deletion protection guards against mistakes: anyone who may delete a table may also
  # switch it off. It follows the same parameter as the user pool, because a protected
  # table would stop a failed first creation from rolling back. teardown.sh switches it
  # off before it deletes a table.
  StateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [ProtectFromDeletion, true, false]
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # The API role may put and query items and nothing else, and it is refused anything
  # that deletes or updates (ApiRole). Note what IAM cannot do: PutItem also replaces an
  # item with the same key, and no condition key can require the "only if new" condition
  # that src/aws.mjs sends. So the code keeps entries from being overwritten, not IAM.
  # The function log holds a digest of every entry, which that role cannot change or
  # delete: cloud/api/verify-audit.mjs compares the two.
  AuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [ProtectFromDeletion, true, false]
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # What the boards did and how they were: an event for each change a board reports, a
  # line for each line of its console (from firmware 1.12.0, cloud/api/src/lib/lines.mjs),
  # and a reading of its signal and memory for each report (cloud/api/src/lib/events.mjs). Only
  # the recorder writes here, and only with PutItem (EventsRole); the API only reads
  # (ApiRole). An event is kept 90 days and a reading 7: DynamoDB deletes an item some time
  # after the epoch second in its `ttl`, usually within a few days, and the API leaves out
  # what has expired meanwhile. Nothing here is a record of who did what: that is the
  # activity log. It is protected like the other two tables all the same, because a
  # mistake should not take the boards' history with it.
  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [ProtectFromDeletion, true, false]
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------------------------------------------------------------------------
  # AWS IoT. The group and policy names are part of the provisioning contract
  # (tools/provision_device.py), so they are fixed.
  # ---------------------------------------------------------------------------------

  DeviceGroup:
    Type: AWS::IoT::ThingGroup
    Properties:
      ThingGroupName: cranium-devices
      ThingGroupProperties:
        ThingGroupDescription: Boards managed by the Cranium firmware console

  # What one board may do with its own certificate. Every resource contains the thing
  # name of the connection, so a board can only act as itself. "${!" keeps the IoT
  # policy variable out of Fn::Sub; "$aws" and "$next" are literal topic parts.
  #
  # cranium/<thing>/events is where firmware 1.12.0 publishes the lines of its console
  # (BoardLogRule below). Publish only: nothing subscribes to it but the rule, and a board
  # gets nothing back on it. From firmware 1.13.0 (docs/fleet.md): cranium/<thing>/location,
  # publish only, what the board hears of the Wi-Fi around it (LocationRule); and
  # cranium/<thing>/commands, subscribe and receive only, where the console's commands arrive
  # (identify, report). A board can neither send itself a command nor hear another board's.
  # From firmware 1.14.0 (docs/memfault.md): cranium/<thing>/memfault, publish only, the board's
  # Memfault chunks (MemfaultRule), whose acknowledgements come back on its commands topic.
  # A change to the document is an update in place: AWS IoT keeps
  # the policy and its name, makes the new document its default version, and every
  # certificate it is attached to has the new rights at once (AWS::IoT::Policy,
  # PolicyDocument: "Update requires: No interruption"; only PolicyName replaces it).
  DevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: cranium-device
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}'
            Condition:
              Bool:
                iot:Connection.Thing.IsAttached: 'true'
          - Effect: Allow
            Action: iot:Publish
            Resource:
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/${!iot:Connection.Thing.ThingName}/shadow/update'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/${!iot:Connection.Thing.ThingName}/jobs/$next/get'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/${!iot:Connection.Thing.ThingName}/jobs/*/update'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/cranium/${!iot:Connection.Thing.ThingName}/events'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/cranium/${!iot:Connection.Thing.ThingName}/location'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/cranium/${!iot:Connection.Thing.ThingName}/memfault'
          - Effect: Allow
            Action: iot:Subscribe
            Resource:
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/things/${!iot:Connection.Thing.ThingName}/jobs/notify-next'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/things/${!iot:Connection.Thing.ThingName}/jobs/$next/get/*'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/things/${!iot:Connection.Thing.ThingName}/jobs/*/update/*'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/cranium/${!iot:Connection.Thing.ThingName}/commands'
          - Effect: Allow
            Action: iot:Receive
            Resource:
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/${!iot:Connection.Thing.ThingName}/jobs/notify-next'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/${!iot:Connection.Thing.ThingName}/jobs/$next/get/*'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/${!iot:Connection.Thing.ThingName}/jobs/*/update/*'
              - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/cranium/${!iot:Connection.Thing.ThingName}/commands'

  # AWS IoT Jobs assumes this role to sign the short-lived download URL it puts into
  # a job document. It can read firmware and nothing else, and only AWS IoT acting for
  # one of this account's cranium-* jobs can assume it.
  PresignRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:job/cranium-*'
      Policies:
        - PolicyName: read-firmware
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${FirmwareBucket.Arn}/firmware/*'

  # AWS IoT writes its own log (connections, refused publishes, job events) to the log
  # group AWSIotLogsV2. That name is AWS IoT's, one per account and Region, and AWS IoT
  # creates the group on first use without a retention period. It may exist already, so
  # it cannot be a resource of this stack: deploy.sh creates it if it is missing and
  # gives it a retention period if it has none.
  #
  # Unlike PresignRole, its trust policy has no conditions unless RestrictIotLoggingTrust
  # says so. This is the policy AWS publishes for the logging role. AWS recommends the
  # conditions for AWS IoT roles in general, but it does not list logging among the
  # features they work with and warns that a service may not supply the keys. If AWS IoT
  # logging does not, the log stops without an error, so this stays a switch to try and
  # to check, not a default.
  IotLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
            Condition: !If
              - RestrictedIotLoggingTrust
              - StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
                ArnLike:
                  aws:SourceArn: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:*'
              - !Ref AWS::NoValue
      Policies:
        - PolicyName: write-iot-log
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:AWSIotLogsV2'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:AWSIotLogsV2:*'

  # The three rules that feed the recorder (EventsFn). Each message is one invocation of it,
  # made by AWS IoT without waiting for the result. The first gets a board's shadow before
  # and after each of its reports, with the thing name from the topic; the second gets AWS
  # IoT's own messages about connections; the third, BoardLogRule, the lines a board on
  # firmware 1.12.0 prints on its console. All only pass on what concerns a thing named
  # like this project's boards; the recorder checks the rest. No message is written
  # anywhere else, and the recorder keeps neither the address nor the certificate that a
  # presence message names.
  ShadowEventsRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Description: The shadow of a Cranium board after each report, for its event log.
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: >-
          SELECT *, topic(3) AS thing FROM '$aws/things/+/shadow/update/documents'
          WHERE startswith(topic(3), 'cranium-')
        Actions:
          - Lambda:
              FunctionArn: !GetAtt EventsFn.Arn

  PresenceEventsRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Description: Connections and disconnections of the Cranium boards, for their event log.
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: >-
          SELECT * FROM '$aws/events/presence/+/+'
          WHERE startswith(topic(5), 'cranium-')
        Actions:
          - Lambda:
              FunctionArn: !GetAtt EventsFn.Arn

  # A board's own log: one message per line, on the topic only that board may publish on.
  # The thing name is taken from the topic, and the time AWS IoT got the message from AWS
  # IoT (timestamp()), never from the board: a message that carries a "thing" or "received"
  # of its own is not passed on at all, so that it cannot name another board or date itself,
  # whichever of the two values the SELECT would keep. WHERE reads the message as it came.
  # At most 5 lines a second per board, by the firmware's own limit (cloud/api/src/lib/lines.mjs).
  BoardLogRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Description: The console lines of a Cranium board, for its event log.
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: >-
          SELECT *, topic(2) AS thing, timestamp() AS received FROM 'cranium/+/events'
          WHERE startswith(topic(2), 'cranium-') AND isUndefined(thing) AND isUndefined(received)
        Actions:
          - Lambda:
              FunctionArn: !GetAtt EventsFn.Arn

  # AWS IoT may invoke the recorder for these three rules of this account, EventBridge for the
  # check of the alerts (AlertCheckPermission, below), and nothing else may.
  ShadowEventsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EventsFn
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt ShadowEventsRule.Arn

  PresenceEventsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EventsFn
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt PresenceEventsRule.Arn

  BoardLogPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EventsFn
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt BoardLogRule.Arn

  # ---------------------------------------------------------------------------------
  # The map, commands and alerts (docs/fleet.md).
  # ---------------------------------------------------------------------------------

  # What a board on firmware 1.13.0 hears of the Wi-Fi around it, to the location function
  # (LocationFn), on the topic only that board may publish on. As for BoardLogRule: the thing
  # name from the topic and the time from AWS IoT, and a message that brings either of its own is
  # not passed on at all. The location function holds the rest to the contract.
  LocationRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Description: What a Cranium board hears of the Wi-Fi around it, for its position on the map.
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: >-
          SELECT *, topic(2) AS thing, timestamp() AS received FROM 'cranium/+/location'
          WHERE startswith(topic(2), 'cranium-') AND isUndefined(thing) AND isUndefined(received)
        Actions:
          - Lambda:
              FunctionArn: !GetAtt LocationFn.Arn

  LocationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LocationFn
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt LocationRule.Arn

  # Every 5 minutes the recorder looks for alerts that are due: a board disconnected for 15
  # minutes, and alerts held back that may go now (cloud/api/src/alerts.mjs). No message of a
  # board can stand in for it: the recorder tells it by the shape EventBridge gives it.
  AlertCheckRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Every 5 minutes, the Cranium recorder sends the e-mail alerts that are due.
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: recorder
          Arn: !GetAtt EventsFn.Arn

  AlertCheckPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EventsFn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AlertCheckRule.Arn

  # The e-mail alerts. A release manager subscribes their own address on the console's Account
  # page (the API may subscribe e-mail addresses and nothing else); SNS asks the address to
  # confirm first, and every e-mail carries a link to stop them. Only the recorder and the
  # location function publish. The messages hold no secret (cloud/api/src/lib/alerts.mjs), so the
  # topic is not encrypted with a key of its own.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Cranium console

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyRequestsWithoutTls
            Effect: Deny
            Principal: '*'
            Action:
              - sns:Publish
              - sns:Subscribe
            Resource: !Ref AlertTopic
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Account-level setting: there is one per account and Region, and it must not be
  # enabled already when this stack is created (deploy.sh checks).
  IotLogging:
    Type: AWS::IoT::Logging
    Properties:
      AccountId: !Ref AWS::AccountId
      RoleArn: !GetAtt IotLoggingRole.Arn
      DefaultLogLevel: !Ref IotLogLevel
      # A connection that fails authentication (a certificate AWS IoT does not know, or
      # an inactive one) is only logged if this event type is switched on by name.
      # Such a connection needs no credential, so anyone who knows the endpoint can add
      # entries to the log: the retention period that deploy.sh sets on the log group
      # is what keeps them from piling up for ever.
      EventConfigurations:
        - EventType: Connection.AuthNError
          LogLevel: INFO

  # ---------------------------------------------------------------------------------
  # Lambda functions. Each has its own role and its own log group. The log group is
  # created first and the role may only write to it, so the function never creates a
  # log group of its own. Each function is told which group to log to (LoggingConfig),
  # so its own name can be left to CloudFormation: a function with a fixed name could
  # not be replaced by a stack update.
  # ---------------------------------------------------------------------------------

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-web'
      RetentionInDays: 90

  WebRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-log
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WebLogGroup.Arn

  # Serves the static console and home page. It holds no secret and may call no AWS API.
  WebFn:
    Type: AWS::Lambda::Function
    DependsOn: WebLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Ref WebLogGroup
      # Also what makes a new commit a real change to the stack: CloudFormation may not
      # apply a change that only touches a parameter and an output.
      Description: !Sub 'Cranium firmware console - static web console - ${DeployedCommit} (${DeployedTree})'
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: server.handler
      MemorySize: 256
      Timeout: 5
      Role: !GetAtt WebRole.Arn
      # Local path: "aws cloudformation package" zips it and puts the S3 location here.
      Code: ../web/src
      Environment:
        Variables:
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          LOGIN_DOMAIN: !Sub '${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
          OAUTH_SCOPE: openid cranium/console
          # For the console's own sign-in page. Public, as the client ID is.
          USER_POOL_ID: !Ref UserPool
          HOME_HOSTS: !If
            - HasHomeDomain
            - !Sub '${HomeDomainName},www.${HomeDomainName}'
            - !Ref AWS::NoValue
          # The customer site: the first name serves it, and the second sends the browser there.
          CUSTOMER_HOSTS: !If
            - HasCustomerDomain
            - !Sub '${CustomerDomainName},www.${CustomerDomainName}'
            - !Ref AWS::NoValue
          # For the customer site's own sign-in page. Public, as the staff client ID is.
          CUSTOMER_POOL_ID: !Ref CustomerUserPool
          CUSTOMER_CLIENT_ID: !Ref CustomerUserPoolClient

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 90

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: console-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLog
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ApiLogGroup.Arn
              # Store an image. No delete.
              - Sid: StoreFirmware
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${FirmwareBucket.Arn}/firmware/*'
              # Read an image, to hand it to a release manager's phone app for an update
              # over Bluetooth. The bucket still refuses a revoked one.
              - Sid: ReadFirmware
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${FirmwareBucket.Arn}/firmware/*'
              # Mark an image as revoked, which makes the bucket refuse to serve it. The
              # role can set exactly this tag and nothing else, so it cannot clear the
              # mark. Both conditions are needed: on its own, the second lets through a
              # request with no tags at all, which would remove the mark.
              - Sid: MarkFirmwareRevoked
                Effect: Allow
                Action: s3:PutObjectTagging
                Resource: !Sub '${FirmwareBucket.Arn}/firmware/*'
                Condition:
                  StringEquals:
                    s3:RequestObjectTag/revoked: 'true'
                  ForAllValues:StringEquals:
                    s3:RequestObjectTagKeys:
                      - revoked
              # The Android app's APKs, in the same bucket under apps/android/ (docs/mobile-apps.md),
              # and only objects named like one: cranium-android-<version>.apk. Three actions, each
              # for one step of handlers/apps.mjs, and no list, no delete, no tagging. PutObject:
              # the URL a release manager's build sends an APK with, which the role signs; it carries
              # the size and the SHA-256, and S3 refuses other bytes. GetObject: HeadObject, to check
              # what arrived before it is published. GetObjectVersion: the download link, which names
              # the version that was checked. Nothing under firmware/ is reachable this way, and a
              # board, which only takes URLs under firmware/, can never be handed an APK.
              - Sid: SendAndroidApks
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${FirmwareBucket.Arn}/apps/android/cranium-android-*.apk'
              - Sid: CheckAndroidApks
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${FirmwareBucket.Arn}/apps/android/cranium-android-*.apk'
              - Sid: ServeAndroidApks
                Effect: Allow
                Action: s3:GetObjectVersion
                Resource: !Sub '${FirmwareBucket.Arn}/apps/android/cranium-android-*.apk'
              # The iPhone app's unsigned IPAs under apps/ios/, the same three steps, and only objects
              # named like one: cranium-ios-<version>.ipa. GetObjectVersion serves the presigned GET
              # that a SideStore source's download address redirects to, and reads the Info.plist out
              # of the zip, in ranges of the version that was checked (lib/ipa.mjs).
              - Sid: SendIphoneIpas
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${FirmwareBucket.Arn}/apps/ios/cranium-ios-*.ipa'
              - Sid: CheckIphoneIpas
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${FirmwareBucket.Arn}/apps/ios/cranium-ios-*.ipa'
              - Sid: ServeIphoneIpas
                Effect: Allow
                Action: s3:GetObjectVersion
                Resource: !Sub '${FirmwareBucket.Arn}/apps/ios/cranium-ios-*.ipa'
              # Releases (pk REL and META), the phone apps' (pk APP), API tokens (pk TOK, keyed
              # by the digest of the token) and SideStore source keys (pk SRC, keyed the same
              # way). A token is looked up with GetItem, a person's tokens are read with Query,
              # and revoking one sets its revokedAt with UpdateItem, as revoking a release sets
              # its status; a source key's use is counted with UpdateItem. TransactWriteItems is authorized through PutItem
              # and UpdateItem; IAM has no action of its own for it. No Scan and no DeleteItem.
              - Sid: ReadAndWriteReleasesAndTokens
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt StateTable.Arn
              # See AuditTable for what this does and does not guarantee.
              - Sid: AppendAndReadAudit
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt AuditTable.Arn
              # The boards' events and readings, for the Events and Diagnostics pages. Read
              # only: the recorder writes them.
              - Sid: ReadEvents
                Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt EventsTable.Arn
              # Nothing above allows these. Said outright so that no later Allow can.
              - Sid: NeverChangeAuditEntries
                Effect: Deny
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:DeleteItem
                  - dynamodb:DeleteTable
                  - dynamodb:PartiQLDelete
                  - dynamodb:PartiQLInsert
                  - dynamodb:PartiQLUpdate
                  - dynamodb:UpdateItem
                  - dynamodb:UpdateTable
                Resource: !GetAtt AuditTable.Arn
              - Sid: CreateDeployments
                Effect: Allow
                Action: iot:CreateJob
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:job/cranium-*'
                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/cranium-*'
              - Sid: CancelAndReadDeployments
                Effect: Allow
                Action:
                  - iot:CancelJob
                  - iot:DescribeJob
                  - iot:ListJobExecutionsForJob
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:job/cranium-*'
              - Sid: ReadOneExecution
                Effect: Allow
                Action: iot:DescribeJobExecution
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:job/cranium-*'
                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/cranium-*'
              # DescribeThing: a board's attribute `board`, for its type (docs/fleet.md).
              - Sid: ReadBoards
                Effect: Allow
                Action:
                  - iot:DescribeThing
                  - iot:ListJobExecutionsForThing
                  - iot:GetThingShadow
                  - iot:ListThingPrincipals
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/cranium-*'
              - Sid: ListBoards
                Effect: Allow
                Action: iot:ListThingsInThingGroup
                Resource: !GetAtt DeviceGroup.Arn
              # ListJobs cannot be limited to a resource.
              - Sid: ListDeployments
                Effect: Allow
                Action: iot:ListJobs
                Resource: '*'
              # Hand the presign role to AWS IoT when creating a job, and to nothing else.
              - Sid: PassPresignRoleToIot
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt PresignRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: iot.amazonaws.com
              # Look up the caller's e-mail and check, live, that they may still read and
              # write.
              - Sid: ReadUsers
                Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminListGroupsForUser
                Resource: !GetAtt UserPool.Arn
              # A command to one board, now (docs/fleet.md): on the commands topic of a board of this
              # project, and on no other topic.
              - Sid: CommandBoards
                Effect: Allow
                Action: iot:Publish
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/cranium/cranium-*/commands'
              # A release manager's own e-mail alerts: subscribe an e-mail address (SNS asks it to
              # confirm), see who is subscribed, and remove a subscription. Nothing else of SNS, and
              # no other topic; the API never publishes.
              - Sid: SubscribeToAlerts
                Effect: Allow
                Action: sns:Subscribe
                Resource: !Ref AlertTopic
                Condition:
                  StringEquals:
                    sns:Protocol: email
              - Sid: ListAndRemoveAlertSubscriptions
                Effect: Allow
                Action:
                  - sns:ListSubscriptionsByTopic
                  - sns:Unsubscribe
                Resource: !Ref AlertTopic
              # The console's Customers page: invite a customer (Cognito sends the e-mail and
              # makes the temporary password), list them, switch one off and on. Never a password,
              # never a group, never a delete, and nothing in the staff pool. Who owns which board
              # is in the state table (pk OWN), under ReadAndWriteReleasesAndTokens above.
              - Sid: ManageCustomers
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminEnableUser
                Resource: !GetAtt CustomerUserPool.Arn
              # Whether a Memfault project key is stored, for a board's page (docs/memfault.md): the
              # secret's metadata, which says whether it has a value. Never the value itself.
              - Sid: SeeMemfaultKey
                Effect: Allow
                Action: secretsmanager:DescribeSecret
                Resource: !Ref MemfaultProjectKey

  ApiFn:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Description: !Sub 'Cranium firmware console - API - ${DeployedCommit} (${DeployedTree})'
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: index.handler
      MemorySize: 512
      Timeout: 20
      Role: !GetAtt ApiRole.Arn
      # Local path: "aws cloudformation package" zips it and puts the S3 location here.
      Code: ../api/src
      Environment:
        Variables:
          STATE_TABLE: !Ref StateTable
          AUDIT_TABLE: !Ref AuditTable
          EVENTS_TABLE: !Ref EventsTable
          FIRMWARE_BUCKET: !Ref FirmwareBucket
          THING_GROUP: !Ref DeviceGroup
          PRESIGN_ROLE_ARN: !GetAtt PresignRole.Arn
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          MOBILE_CLIENT_ID: !Ref MobileUserPoolClient
          SIGNING_PUBLIC_KEY_B64: !Ref SigningPublicKey
          SLOT_SIZE: !Ref SlotSize
          LOAD_ADDRESS: !Ref LoadAddress
          ALERT_TOPIC_ARN: !Ref AlertTopic
          # The phone apps' configuration, which the Apps page hands out (GET /api/apps/config): the
          # console's address and the host of its login pages, as apps/configure.sh takes them.
          CONSOLE_URL: !If [HasConsoleDomain, !Sub 'https://${ConsoleDomainName}/', !Sub '${Api.ApiEndpoint}/']
          LOGIN_DOMAIN: !Sub '${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
          # The Customers page (handlers/customers.mjs). An invitation names the site, so none
          # goes out while it has no address.
          CUSTOMER_POOL_ID: !Ref CustomerUserPool
          CUSTOMER_SITE_URL: !If [HasCustomerDomain, !Sub 'https://${CustomerDomainName}/', '']
          # Memfault (docs/memfault.md): the secret whose metadata says whether a project key is
          # stored, and the slugs of the link to a board in Memfault. None of the three is a secret.
          MEMFAULT_KEY_SECRET_ARN: !Ref MemfaultProjectKey
          MEMFAULT_ORG_SLUG: !Ref MemfaultOrgSlug
          MEMFAULT_PROJECT_SLUG: !Ref MemfaultProjectSlug
          # The phone apps' customer side, in their configuration (GET /api/apps/config).
          CUSTOMER_MOBILE_CLIENT_ID: !Ref CustomerMobileUserPoolClient

  # ---------------------------------------------------------------------------------
  # The customer API (cloud/api/src/customer/app.mjs): what a customer reads about their own
  # boards. A function and a role of its own, so that a fault in it can reach no more than it
  # needs: the shadows of the boards, their events, who owns which board, and whether a
  # customer's account is on. No firmware, no deployments, no activity log, no staff accounts,
  # no writes of any kind.
  # ---------------------------------------------------------------------------------

  CustomerApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-customer-api'
      RetentionInDays: 90

  CustomerApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: customer-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLog
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CustomerApiLogGroup.Arn
              # Who owns which board: the OWN partition of the state table, and no other. Releases
              # and API tokens live in the same table, in partitions this role cannot read.
              - Sid: ReadOwnership
                Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt StateTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - OWN
              # The events of the boards. Which board's, the function decides: the owner's only.
              - Sid: ReadEvents
                Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt EventsTable.Arn
              - Sid: ReadShadows
                Effect: Allow
                Action: iot:GetThingShadow
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/cranium-*'
              # Whether the caller's account is on, asked on every request but for a minute's grace.
              - Sid: CheckCustomers
                Effect: Allow
                Action: cognito-idp:AdminGetUser
                Resource: !GetAtt CustomerUserPool.Arn

  CustomerApiFn:
    Type: AWS::Lambda::Function
    DependsOn: CustomerApiLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Ref CustomerApiLogGroup
      Description: !Sub 'Cranium customer site - API - ${DeployedCommit} (${DeployedTree})'
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: customer.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt CustomerApiRole.Arn
      # Local path: "aws cloudformation package" zips it and puts the S3 location here.
      Code: ../api/src
      Environment:
        Variables:
          STATE_TABLE: !Ref StateTable
          EVENTS_TABLE: !Ref EventsTable
          CUSTOMER_POOL_ID: !Ref CustomerUserPool
          CUSTOMER_CLIENT_ID: !Ref CustomerUserPoolClient
          CUSTOMER_MOBILE_CLIENT_ID: !Ref CustomerMobileUserPoolClient

  EventsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-events'
      RetentionInDays: 90

  # The recorder may write to its log and put items in the events table; read the alerts' own part
  # of that table and publish to the alert topic, for the e-mail alerts; and nothing else: no read of
  # the boards' events, no update, no delete, and no other table.
  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: record-events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLog
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt EventsLogGroup.Arn
              - Sid: RecordEvents
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt EventsTable.Arn
              # The alerts' own part of the table (pk ALERTS: what each board's alerts last sent),
              # and nothing else of it: the boards' events stay unread by the recorder.
              - Sid: ReadAlerts
                Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt EventsTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - ALERTS
              - Sid: SendAlerts
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  # The recorder: turns the messages of the three rules above into events and readings. It
  # is the API's code with another entry point (cloud/api/src/events.mjs), and is given
  # only the name of the events table.
  EventsFn:
    Type: AWS::Lambda::Function
    DependsOn: EventsLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Ref EventsLogGroup
      Description: !Sub 'Cranium firmware console - event recorder - ${DeployedCommit} (${DeployedTree})'
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: events.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt EventsRole.Arn
      # Local path: "aws cloudformation package" zips it and puts the S3 location here.
      Code: ../api/src
      Environment:
        Variables:
          EVENTS_TABLE: !Ref EventsTable
          # The e-mail alerts: where they go, and the address they link to.
          ALERT_TOPIC_ARN: !Ref AlertTopic
          CONSOLE_URL: !If [HasConsoleDomain, !Sub 'https://${ConsoleDomainName}/', !Sub '${Api.ApiEndpoint}/']

  # A message that cannot be recorded is tried once more, and given up after an hour: the
  # event log is a view of the boards, and a backlog of old messages is worth less than
  # the invocations it would cost.
  EventsFnInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref EventsFn
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      MaximumEventAgeInSeconds: 3600

  # The location function (cloud/api/src/locator.mjs): from what a board hears of the Wi-Fi around
  # it to a position, through AWS IoT Core Device Location, at most once per board every 10
  # minutes. It is a function of its own, not a part of the recorder, because it is the one piece
  # that spends money for each message (a position estimate) and sends what a board heard out of
  # AWS IoT, to the solver's provider: only its role may call GetPositionEstimate, so nothing that
  # handles the boards' other messages can, and its log counts the estimates.
  LocationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-location'
      RetentionInDays: 90

  # It may write to its log; read and write its own two parts of the events table, the positions
  # (pk LOC) and the alerts (pk ALERTS), and put a board's events there; ask for position estimates;
  # and publish to the alert topic, for a board that moved. Nothing else.
  LocationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: locate-boards
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLog
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LocationLogGroup.Arn
              - Sid: ReadPositionsAndAlerts
                Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt EventsTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - LOC
                      - ALERTS
              # Its two parts, and a board's own events ("found", "moved").
              - Sid: RecordPositions
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt EventsTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - LOC
                      - ALERTS
                      - cranium-*
              # GetPositionEstimate has no resource type: IAM can only allow it on every resource.
              - Sid: EstimatePositions
                Effect: Allow
                Action: iotwireless:GetPositionEstimate
                Resource: '*'
              - Sid: SendAlerts
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic

  LocationFn:
    Type: AWS::Lambda::Function
    DependsOn: LocationLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Ref LocationLogGroup
      Description: !Sub 'Cranium firmware console - location from Wi-Fi - ${DeployedCommit} (${DeployedTree})'
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: location.handler
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt LocationRole.Arn
      # Local path: "aws cloudformation package" zips it and puts the S3 location here.
      Code: ../api/src
      Environment:
        Variables:
          EVENTS_TABLE: !Ref EventsTable
          ALERT_TOPIC_ARN: !Ref AlertTopic
          CONSOLE_URL: !If [HasConsoleDomain, !Sub 'https://${ConsoleDomainName}/', !Sub '${Api.ApiEndpoint}/']

  # A scan that cannot be solved is not tried again: a second try of a paid estimate is worth less
  # than the next scan, which comes within 6 hours, or at once on "Report now".
  LocationFnInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref LocationFn
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 600

  # ---------------------------------------------------------------------------------
  # Memfault (docs/memfault.md, course manual 3.11). From firmware 1.14.0 a board keeps Memfault's
  # data, its coredump, its reboot reasons, its metrics and its trace events, and sends it in chunks
  # of at most 400 bytes over its own MQTT connection, one at a time: AWS IoT stays the board's only
  # cloud and its only way to an update. The forwarder (cloud/api/src/forwarder.mjs) posts each chunk
  # to Memfault's chunks API with the project key, which only it can read, and answers the board on
  # its commands topic, so that the board sends the next one. Without a key it drops the chunk and
  # does not answer, and the board keeps its data and tries again later.
  # ---------------------------------------------------------------------------------

  # A board's chunks, on the topic only that board may publish on. A chunk is binary, so the rule
  # hands it over as base64; the thing name comes from the topic and the time from AWS IoT, and no
  # field of the message can be read, since it has none. The forwarder holds the frame to the contract.
  MemfaultRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Description: Memfault chunks of a Cranium board, for Memfault's cloud.
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: >-
          SELECT encode(*, 'base64') AS frame, topic(2) AS thing, timestamp() AS received FROM 'cranium/+/memfault'
          WHERE startswith(topic(2), 'cranium-')
        Actions:
          - Lambda:
              FunctionArn: !GetAtt MemfaultFn.Arn
        # When AWS IoT cannot invoke the forwarder, it says so here, with the message it could not
        # hand over (a chunk: no secret). The board gets no answer and sends the chunk again.
        ErrorAction:
          CloudwatchLogs:
            LogGroupName: !Ref MemfaultRuleErrorLogGroup
            RoleArn: !GetAtt MemfaultRuleErrorRole.Arn

  MemfaultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MemfaultFn
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt MemfaultRule.Arn

  MemfaultRuleErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/iot/${AWS::StackName}-memfault-rule-errors'
      RetentionInDays: 90

  # What AWS IoT assumes to write the rule's errors: that log group, and nothing else. Only AWS IoT
  # acting for a rule of this account can assume it. The CloudWatch Logs action of AWS IoT names
  # DescribeLogStreams among what it needs beside the two writes.
  MemfaultRuleErrorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rule/*'
      Policies:
        - PolicyName: write-memfault-rule-errors
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteRuleErrors
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !GetAtt MemfaultRuleErrorLogGroup.Arn

  # The Memfault project key. The stack makes the secret with no value: cloud/deploy.sh stores
  # ~/.cranium/memfault_project_key in it when that file exists, so the key is never in the template,
  # a parameter or the repository. Only the forwarder may read it; the API may only see whether it
  # has a value.
  MemfaultProjectKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/memfault-project-key'
      Description: >-
        Memfault project key for the Cranium forwarder. Stored by cloud/deploy.sh from
        ~/.cranium/memfault_project_key; empty until then.

  MemfaultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-memfault'
      RetentionInDays: 90

  # It may write to its log, read the project key, and answer a board on its commands topic.
  # Nothing else: no table, no other secret, no other topic.
  MemfaultRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: forward-memfault-chunks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLog
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt MemfaultLogGroup.Arn
              - Sid: ReadProjectKey
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref MemfaultProjectKey
              - Sid: AnswerBoards
                Effect: Allow
                Action: iot:Publish
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/cranium/cranium-*/commands'

  MemfaultFn:
    Type: AWS::Lambda::Function
    DependsOn: MemfaultLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Ref MemfaultLogGroup
      Description: !Sub 'Cranium firmware console - Memfault chunks - ${DeployedCommit} (${DeployedTree})'
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: memfault.handler
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt MemfaultRole.Arn
      # Local path: "aws cloudformation package" zips it and puts the S3 location here.
      Code: ../api/src
      Environment:
        Variables:
          MEMFAULT_KEY_SECRET_ARN: !Ref MemfaultProjectKey
          MEMFAULT_CHUNKS_HOST: !Ref MemfaultChunksHost

  # A chunk is never tried again here: the board sends it again when no answer comes, and two tries
  # at once could put a board's chunks out of order.
  MemfaultFnInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref MemfaultFn
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 60

  # ---------------------------------------------------------------------------------
  # Staged rollouts (docs/fleet.md, cloud/api/src/handlers/rollouts.mjs). A rollout starts with a
  # canary, and its waves follow once the canary has confirmed the update. AWS IoT Jobs paces a
  # job and stops it by itself (jobExecutionsRolloutConfig, abortConfig), but it has no way to
  # wait for one job before it starts another. This function does that: every minute it reads
  # the open rollouts and starts the waves of those whose canary has confirmed, or marks one
  # stopped, and says so in the activity log as the console's own doing. It serves no request
  # and nothing on the internet reaches it; invoked by anything else, it only does what is due.
  # ---------------------------------------------------------------------------------

  RolloutTickLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-rollouts'
      RetentionInDays: 90

  # What starting a wave takes and no more: the releases and the fleet's records, written only for
  # a rollout (pk ROL); an entry added to the activity log, never changed; the jobs of this
  # console, the boards' shadows and attributes, and handing the presign role to AWS IoT; and, for
  # the alert of a rollout that stopped by itself, the alerts' own part of the events table (pk
  # ALERTS) and the alert topic. No S3, no Cognito, none of the boards' events.
  RolloutTickRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: advance-rollouts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLog
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt RolloutTickLogGroup.Arn
              - Sid: ReadReleasesAndFleet
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !GetAtt StateTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - REL
                      - ROL
                      - GRP
                      - SEEN
              - Sid: WriteRollouts
                Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt StateTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - ROL
              - Sid: AppendAudit
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AuditTable.Arn
              - Sid: StartAndReadDeployments
                Effect: Allow
                Action: iot:CreateJob
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:job/cranium-*'
                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/cranium-*'
              - Sid: CancelAndReadJobs
                Effect: Allow
                Action:
                  - iot:CancelJob
                  - iot:DescribeJob
                  - iot:ListJobExecutionsForJob
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:job/cranium-*'
              - Sid: ReadOneExecution
                Effect: Allow
                Action: iot:DescribeJobExecution
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:job/cranium-*'
                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/cranium-*'
              - Sid: ReadBoards
                Effect: Allow
                Action:
                  - iot:DescribeThing
                  - iot:ListJobExecutionsForThing
                  - iot:GetThingShadow
                Resource: !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/cranium-*'
              - Sid: ListBoards
                Effect: Allow
                Action: iot:ListThingsInThingGroup
                Resource: !GetAtt DeviceGroup.Arn
              # ListJobs cannot be limited to a resource.
              - Sid: ListDeployments
                Effect: Allow
                Action: iot:ListJobs
                Resource: '*'
              - Sid: PassPresignRoleToIot
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt PresignRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: iot.amazonaws.com
              # The alert of a rollout that stopped by itself (src/alerts.mjs): what the alerts last
              # sent, and the e-mail. Only the alerts' part of the events table.
              - Sid: ReadAlerts
                Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt EventsTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - ALERTS
              - Sid: WriteAlerts
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt EventsTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - ALERTS
              - Sid: SendAlerts
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Sid: NeverChangeAuditEntries
                Effect: Deny
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:DeleteItem
                  - dynamodb:DeleteTable
                  - dynamodb:PartiQLDelete
                  - dynamodb:PartiQLInsert
                  - dynamodb:PartiQLUpdate
                  - dynamodb:UpdateItem
                  - dynamodb:UpdateTable
                Resource: !GetAtt AuditTable.Arn

  # The API's code with another entry point (cloud/api/src/rollouts-tick.mjs). It reads the same
  # configuration as the API, because it builds the same handlers; its role is what it may do.
  RolloutTickFn:
    Type: AWS::Lambda::Function
    DependsOn: RolloutTickLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Ref RolloutTickLogGroup
      Description: !Sub 'Cranium firmware console - staged rollouts - ${DeployedCommit} (${DeployedTree})'
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: rollouts-tick.handler
      MemorySize: 256
      Timeout: 50
      Role: !GetAtt RolloutTickRole.Arn
      # Local path: "aws cloudformation package" zips it and puts the S3 location here.
      Code: ../api/src
      Environment:
        Variables:
          STATE_TABLE: !Ref StateTable
          AUDIT_TABLE: !Ref AuditTable
          EVENTS_TABLE: !Ref EventsTable
          FIRMWARE_BUCKET: !Ref FirmwareBucket
          THING_GROUP: !Ref DeviceGroup
          PRESIGN_ROLE_ARN: !GetAtt PresignRole.Arn
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          MOBILE_CLIENT_ID: !Ref MobileUserPoolClient
          SIGNING_PUBLIC_KEY_B64: !Ref SigningPublicKey
          SLOT_SIZE: !Ref SlotSize
          LOAD_ADDRESS: !Ref LoadAddress
          # The alert of a rollout that stopped by itself: the topic, and the console's address for
          # the e-mail's link.
          ALERT_TOPIC_ARN: !Ref AlertTopic
          CONSOLE_URL: !If [HasConsoleDomain, !Sub 'https://${ConsoleDomainName}/', !Sub '${Api.ApiEndpoint}/']

  # One run at a time is enough, and a run that fails is not tried again: the next minute's is.
  RolloutTickInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref RolloutTickFn
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 60

  RolloutTickRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Every minute, the Cranium console moves its staged rollouts on.
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: rollouts
          Arn: !GetAtt RolloutTickFn.Arn

  RolloutTickPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RolloutTickFn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RolloutTickRule.Arn

  # ---------------------------------------------------------------------------------
  # The sign-in trigger: Cognito's pre token generation trigger (UserPool, LambdaConfig).
  #
  # Why it exists. The console's own sign-in page (six boxes for the code) talks to the
  # user pool API with USER_SRP_AUTH, so that the password never leaves the browser.
  # Cognito gives a token made that way one scope, aws.cognito.signin.user.admin, and not
  # cranium/console, which every API route demands. For the console's web client only,
  # and only at the end of such a sign-in or at a refresh, the function adds
  # cranium/console and takes aws.cognito.signin.user.admin out, so that the token cannot
  # be used to read or change the account through Cognito's user APIs. That is what the
  # managed login pages hand out already. Their tokens, the phone apps' client and every
  # other step pass through unchanged (cloud/api/src/signin-scope.mjs).
  #
  # Cognito calls it for every token of the pool and waits at most 5 seconds. While it
  # cannot be called nobody gets a token, by either page and from either client: on the
  # first deployment with it, for the moments between the update of the pool and the
  # creation of the function and its permission.
  #
  # Its name is fixed, unlike the other functions', because the pool names it by ARN (see
  # UserPool). The only properties that would make CloudFormation replace it, and so fail
  # on the name, are the name itself and the package type, and neither is meant to change.
  # ---------------------------------------------------------------------------------

  SignInScopeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-signin-scope'
      RetentionInDays: 90

  # It may write to its log, and nothing else: it reads and calls nothing.
  SignInScopeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-log
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLog
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt SignInScopeLogGroup.Arn

  SignInScopeFn:
    Type: AWS::Lambda::Function
    DependsOn: SignInScopeLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-signin-scope'
      LoggingConfig:
        LogGroup: !Ref SignInScopeLogGroup
      Description: !Sub 'Cranium firmware console - sign-in scope - ${DeployedCommit} (${DeployedTree})'
      Runtime: nodejs22.x
      Architectures:
        - arm64
      Handler: signin-scope.handler
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt SignInScopeRole.Arn
      # Local path: "aws cloudformation package" zips it and puts the S3 location here.
      Code: ../api/src
      Environment:
        Variables:
          # The only clients whose tokens it changes: the console's and the phone apps'.
          CONSOLE_CLIENT_ID: !Ref UserPoolClient
          MOBILE_CLIENT_ID: !Ref MobileUserPoolClient

  # Cognito may call it for this user pool, in this account, and nothing else may.
  SignInScopePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SignInScopeFn
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt UserPool.Arn

Outputs:
  ConsoleUrl:
    Description: Address of the console. Also the redirect URI the console signs in with.
    Value: !If [HasConsoleDomain, !Sub 'https://${ConsoleDomainName}/', !Sub '${Api.ApiEndpoint}/']
  ConsoleDomainTarget:
    Condition: HasConsoleDomain
    Description: What the DNS record of ConsoleDomainName has to point to.
    Value: !GetAtt ConsoleDomain.RegionalDomainName
  HomeUrl:
    Condition: HasHomeDomain
    Description: Address of the public home page.
    Value: !Sub 'https://${HomeDomainName}/'
  HomeDomainTarget:
    Condition: HasHomeDomain
    Description: What the DNS record of HomeDomainName has to point to.
    Value: !GetAtt HomeDomain.RegionalDomainName
  HomeWwwDomainTarget:
    Condition: HasHomeDomain
    Description: What the DNS record of www.<HomeDomainName> has to point to.
    Value: !GetAtt HomeWwwDomain.RegionalDomainName
  CustomerUrl:
    Condition: HasCustomerDomain
    Description: Address of the customer website. Admin mode is /admin there.
    Value: !Sub 'https://${CustomerDomainName}/'
  CustomerDomainTarget:
    Condition: HasCustomerDomain
    Description: What the DNS record of CustomerDomainName has to point to.
    Value: !GetAtt CustomerDomain.RegionalDomainName
  CustomerWwwDomainTarget:
    Condition: HasCustomerDomain
    Description: What the DNS record of www.<CustomerDomainName> has to point to.
    Value: !GetAtt CustomerWwwDomain.RegionalDomainName
  CustomerUserPoolId:
    Description: The customer pool, apart from the staff pool (UserPoolId).
    Value: !Ref CustomerUserPool
  CustomerClientId:
    Description: The customer site's client of the customer pool.
    Value: !Ref CustomerUserPoolClient
  CustomerMobileClientId:
    Description: The phone apps' client of the customer pool. apps/configure.sh copies it into their configuration.
    Value: !Ref CustomerMobileUserPoolClient
  CustomerApiFunctionName:
    Value: !Ref CustomerApiFn
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  MobileClientId:
    Description: The phone apps' client id. apps/configure.sh copies it into their configuration.
    Value: !Ref MobileUserPoolClient
  LoginDomain:
    Description: Host name of the managed login pages.
    Value: !Sub '${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  FirmwareBucketName:
    Value: !Ref FirmwareBucket
  FirmwareDownloadPrefix:
    Description: A board only downloads firmware from URLs that start with this.
    Value: !Sub 'https://${FirmwareBucket}.s3.${AWS::Region}.amazonaws.com/firmware/'
  DeviceGroupName:
    Value: !Ref DeviceGroup
  DevicePolicyName:
    Value: !Ref DevicePolicy
  StateTableName:
    Value: !Ref StateTable
  AuditTableName:
    Value: !Ref AuditTable
  EventsTableName:
    Value: !Ref EventsTable
  ApiFunctionName:
    Value: !Ref ApiFn
  WebFunctionName:
    Value: !Ref WebFn
  EventsFunctionName:
    Value: !Ref EventsFn
  RolloutsFunctionName:
    Description: The function that moves staged rollouts on, every minute.
    Value: !Ref RolloutTickFn
  LocationFunctionName:
    Value: !Ref LocationFn
  MemfaultFunctionName:
    Description: The function that forwards the boards' Memfault chunks (docs/memfault.md).
    Value: !Ref MemfaultFn
  MemfaultProjectKeyArn:
    Description: >-
      The secret that holds the Memfault project key, which cloud/deploy.sh stores from
      ~/.cranium/memfault_project_key. Its name, never its value.
    Value: !Ref MemfaultProjectKey
  AlertTopicArn:
    Description: Where the e-mail alerts go. Release managers subscribe on the console's Account page.
    Value: !Ref AlertTopic
  DeployedCommit:
    Description: The git commit this deployment was built from.
    Value: !Ref DeployedCommit
  DeployedTree:
    Description: clean if the files this deployment was built from match that commit, dirty if not.
    Value: !Ref DeployedTree
