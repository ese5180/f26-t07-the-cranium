# Builds share a 16 GB Mac with other work: keep Gradle and the Kotlin daemon small.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1024m

android.useAndroidX=true
kotlin.code.style=official

# The app's own version, not the firmware's. build-release.sh names the APK after craniumVersionName.
craniumVersionName=0.8.23
craniumVersionCode=35
