# Builds the firmware build image (tools/firmware-image/Dockerfile) and publishes it to GitHub Packages.
# docs/ci.md, "The firmware build image". Nothing in ci.yml uses it yet.
name: Firmware build image

on:
  push:
    branches: [main]
    paths:
      - tools/firmware-image/**
      - .github/workflows/firmware-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NCS_VERSION: v3.4.0
  IMAGE: ghcr.io/${{ github.repository }}/firmware-build

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the tags
        id: tags
        run: |
          echo "list=${IMAGE}:${NCS_VERSION},${IMAGE}:${NCS_VERSION}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/firmware-image
          push: true
          tags: ${{ steps.tags.outputs.list }}
