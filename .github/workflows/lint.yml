# Checks of the repository itself, apart from the builds and tests of ci.yml: the workflows
# (actionlint), the shell scripts (shellcheck) and secrets (gitleaks). All free. docs/ci.md,
# "Repository tools". Prettier is in ci.yml, with the cloud tests.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Workflows, scripts and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # The two tools are their authors' release binaries, each checked against the release's own
      # list of SHA-256 sums before it runs. GitHub's release downloads sometimes answer 504 for a
      # moment: each download is tried up to six times before the job gives up.
      - name: Fetch actionlint and gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "$base/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: Workflows (actionlint, with shellcheck on their run steps)
        run: '"$RUNNER_TEMP/actionlint" -color'

      - name: Shell scripts (shellcheck, warnings and errors)
        # build_image.sh is a zsh script, which shellcheck does not read.
        run: |
          git ls-files -z '*.sh' ':!firmware/tests/hil/build_image.sh' | xargs -0 shellcheck -S warning -f gcc

      - name: Secrets (gitleaks, the whole history, with .gitleaks.toml)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml .'
