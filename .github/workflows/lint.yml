# Checks of the repository itself, apart from the builds and tests of ci.yml: the workflows
# (actionlint), the shell scripts (shellcheck) and secrets (gitleaks). All free. docs/ci.md,
# "Repository tools". Prettier is in ci.yml, with the cloud tests.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Workflows, scripts and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Fetch actionlint and gitleaks
        # Each is its author's release binary, checked against the release's own SHA-256 sums. When
        # GitHub's release downloads fail (they answered 504 for hours on 2026-11-09), the same version
        # is built from source through Go's module proxy instead, which checks it against the Go
        # checksum database.
        run: |
          cd "$RUNNER_TEMP"
          fetch() { curl -fsSLO --retry 4 --retry-all-errors --retry-delay 5 --max-time 120 "$1"; }
          if fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" &&
            fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt" &&
            sha256sum -c --ignore-missing "actionlint_${ACTIONLINT_VERSION}_checksums.txt"; then
            tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          else
            echo "::warning::actionlint's release download failed; building v${ACTIONLINT_VERSION} through the Go proxy"
            GOBIN="$RUNNER_TEMP" go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          fi
          if fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" &&
            fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" &&
            sha256sum -c --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"; then
            tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          else
            echo "::warning::gitleaks' release download failed; building v${GITLEAKS_VERSION} through the Go proxy"
            GOBIN="$RUNNER_TEMP" go install "github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}"
          fi
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/gitleaks" version

      - name: Workflows (actionlint, with shellcheck on their run steps)
        run: '"$RUNNER_TEMP/actionlint" -color'

      - name: Shell scripts (shellcheck, warnings and errors)
        # build_image.sh is a zsh script, which shellcheck does not read.
        run: |
          git ls-files -z '*.sh' ':!firmware/tests/hil/build_image.sh' | xargs -0 shellcheck -S warning -f gcc

      - name: Release notes script (scripts/tests/notes-test.sh)
        run: scripts/tests/notes-test.sh

      - name: Secrets (gitleaks, the whole history, with .gitleaks.toml)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml .'
