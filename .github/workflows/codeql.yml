# CodeQL code scanning (free for public repositories): GitHub's own analysis for security bugs,
# on every push to main, every pull request and once a week. Its findings are on the repository's
# Security tab. docs/ci.md, "Repository tools". Kotlin and Swift are left out: they need full builds
# of the apps, which ci.yml already does, and would double the time.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # github/codeql-action v4.39.1
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26
        with:
          category: /language:${{ matrix.language }}
