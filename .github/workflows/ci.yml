# What runs here, what it proves and what it does not: docs/ci.md.
#
# The project's firmware signing key is never in a job of this workflow. Anyone with push access can
# write a workflow that sends a secret somewhere, and that key is trusted by every board. A firmware
# job makes a throwaway key and never saves it, so what it builds cannot be installed.

name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run that checks a published release is the only one there will be for it.
  cancel-in-progress: ${{ github.event_name != 'release' }}

# Named, because GitHub Actions gives a step without a shell `bash -e`, with no pipefail: a test piped
# into tee would then pass whatever it did. It is also how the toolchain image gets its tools: see below.
defaults:
  run:
    shell: bash

env:
  NCS_VERSION: v3.4.0
  # The commit of that tag in sdk-nrf. firmware/tests/fetch-sdk-files.sh names it as well.
  NCS_COMMIT: 99553055607b2e9885fbc80ccd11fa9da81c2df0
  # Raise this to start from an empty cache.
  NCS_CACHE_GENERATION: 1

jobs:
  scan:
    name: No private key in git
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for private keys and wifi_secrets.h in the tracked files
        run: scripts/scan-tracked-files.sh

  host-tests:
    name: Host tests
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the files of the SDK that the tests read
        run: |
          firmware/tests/fetch-sdk-files.sh "$RUNNER_TEMP/sdk"
          echo "ZEPHYR_BASE=$RUNNER_TEMP/sdk/zephyr" >> "$GITHUB_ENV"
      - name: Run the tests, with the address and undefined-behaviour sanitizers
        run: make -C firmware/tests/host

  python-tests:
    name: Python tests
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12' # As in the toolchain image.
      - name: Install what the tools and imgtool need
        run: python3 -m pip install --quiet --requirement firmware/tests/requirements.txt
      - name: Fetch the files of the SDK that the tests read
        run: |
          firmware/tests/fetch-sdk-files.sh "$RUNNER_TEMP/sdk"
          echo "ZEPHYR_BASE=$RUNNER_TEMP/sdk/zephyr" >> "$GITHUB_ENV"
      # Without these test_board.py would skip most of itself and call that a pass. The second is
      # the same console with the test fault built in, for the tests of a stuck board.
      - name: Build the console's real code for a pseudo-terminal
        run: make -C firmware/tests/host build/console_sim build/console_sim_fault
      # scripts/new-board.sh in a scratch copy of the repository, with stand-ins for nrfutil, west, aws,
      # node and the tools that talk to a board, and tools/new_board.py, which it runs, also against the
      # console simulator just built. None of them may skip here.
      - name: Run the tests of the new-board script
        run: |
          python3 firmware/tests/hil/test_new_board.py 2>&1 | tee "$RUNNER_TEMP/new-board.log"
          [ "$(grep -E '^(OK|FAILED)' "$RUNNER_TEMP/new-board.log" | tail -n 1)" = OK ]
      - name: Run the tests, and fail on any skip that is not listed here
        run: |
          # The two skips: test_golden.py checks the kept image of firmware 1.3.0 if binaries/ has it,
          # and binaries/ is not in git; test_flash_layout.py checks the last build's partitions if
          # build/ has one, and nothing is built here (the firmware jobs check their own build).
          run_test() {
            local log
            log=$(mktemp)
            if [ "$1" = test_board.py ]; then
              # 276 tests that mostly wait on simulated boards: in 8 processes it takes about a minute
              # instead of six. run_sharded.py ends with the same OK or FAILED line as unittest.
              python3 firmware/tests/hil/run_sharded.py --jobs 8 --split-classes "firmware/tests/hil/$1" 2>&1 | tee "$log"
            else
              python3 "firmware/tests/hil/$1" 2>&1 | tee "$log"
            fi
            if [ "$(grep -E '^(OK|FAILED)' "$log" | tail -n 1)" != "$2" ]; then
              echo "::error file=firmware/tests/hil/$1::Expected the result \"$2\". A new skip has to be listed in ci.yml, with its reason."
              exit 1
            fi
          }
          run_test test_board.py 'OK'
          run_test test_recover.py 'OK'
          run_test test_golden.py 'OK (skipped=1)'
          run_test test_build_report.py 'OK'
          run_test test_check_image.py 'OK'
          run_test test_flash_layout.py 'OK (skipped=1)'
          run_test test_memfault_upload.py 'OK'
          run_test test_provision.py 'OK'
          run_test test_bt_only_check.py 'OK'

  cloud-tests:
    name: Cloud tests
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: API
        working-directory: cloud/api
        run: node --test
      - name: Website
        working-directory: cloud/web
        run: node --test
      - name: Local preview
        working-directory: cloud/dev
        run: node --test

  # The phone apps. Their real configuration names the AWS account and is never in git, so these
  # builds use apps/config/cranium.example.json and say so: nothing built here can sign in.
  android:
    name: Android app
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests and a debug build
        working-directory: apps/android
        run: ./gradlew --console=plain --no-daemon testDebugUnitTest assembleDebug

  ios:
    name: iPhone app
    if: github.event_name != 'release'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the newest Xcode on the runner
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: The logic package's build and tests
        working-directory: apps/ios/CraniumKit
        run: swift test
      # XcodeGen makes the project, which is not in git. It comes from Homebrew, unpinned, and only
      # for this check: nothing built here is installed anywhere.
      - name: The app, compiled for iPhone without signing
        run: |
          brew install xcodegen
          apps/ios/scripts/generate.sh
          xcodebuild -project apps/ios/Cranium.xcodeproj -scheme Cranium -configuration Debug \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

  firmware:
    name: Firmware (${{ matrix.configuration }})
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Runs as root with HOME=/github/home, which the runner sets over the image's HOME=/opt. The runner
    # replaces the image's entry point, so a step that runs in bash is what gets the toolchain: the image
    # sets BASH_ENV to a script that puts it on the PATH, and a step that does not run in bash, such as
    # an action, sees none of it. sysbuild.cmake looks for the signing key under this HOME.
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0@sha256:f1dca44678dae83e37404e33f369786f5b2ffe2ed497eec1815f66c3a868bace
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: default
            board: nrf7002dk/nrf5340/cpuapp/ns
            cmake-args: ''
          - configuration: no Bluetooth
            board: nrf7002dk/nrf5340/cpuapp/ns
            cmake-args: -DSB_EXTRA_CONF_FILE=no_bt_sysbuild.conf
          # Bluetooth only and no Wi-Fi. firmware/app/sysbuild.cmake picks its configuration by the
          # board, so it needs no arguments of its own.
          - configuration: nRF5340 DK
            board: nrf5340dk/nrf5340/cpuapp/ns
            cmake-args: ''
    env:
      BOARD: ${{ matrix.board }}
      CMAKE_ARGS: ${{ matrix.cmake-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the toolchain, and let git work on what is not this user's
        run: |
          # The runner made the workspace, and this container runs as root. Git would refuse the checkout,
          # and tools/store_binary.py would then record the commit as "unknown". Nordic's README for this
          # image gives this same line.
          git config --global --add safe.directory '*'
          echo "user $(id -un), HOME $HOME"
          west --version
          python3 --version
          arm-zephyr-eabi-gcc --version | sed -n 1p

      # No restore-keys: only a cache of exactly this SDK may be used. The next two steps show that it
      # is that SDK, and the cache is saved before the build, so it holds no build output.
      - name: Restore the SDK from the cache
        id: ncs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ncs
          key: ncs-${{ env.NCS_VERSION }}-${{ env.NCS_COMMIT }}-${{ env.NCS_CACHE_GENERATION }}

      - name: Fetch the SDK, or bring the cached one up to its manifest
        run: |
          if [ ! -d "$HOME/ncs/.west" ]; then
            west init -m https://github.com/nrfconnect/sdk-nrf --mr "$NCS_VERSION" --clone-opt=--depth=1 "$HOME/ncs"
          fi
          cd "$HOME/ncs"
          # Over fifty fetches from GitHub, so allow for one of them to fail.
          for attempt in 1 2 3; do
            west update --narrow --fetch-opt=--depth=1 && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 30
          done
          echo "ZEPHYR_BASE=$HOME/ncs/zephyr" >> "$GITHUB_ENV"

      - name: Check that the SDK is exactly the one it should be
        run: scripts/check-west-workspace.sh "$HOME/ncs" "$NCS_COMMIT"

      - name: Save the SDK to the cache
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ncs
          key: ncs-${{ env.NCS_VERSION }}-${{ env.NCS_COMMIT }}-${{ env.NCS_CACHE_GENERATION }}

      # imgtool directly, not tools/keys.py, which would write the throwaway public key over
      # firmware/keys/fw_signing_pub.pem and leave the tree changed.
      - name: Make a throwaway signing key, outside the cache and the artifact
        run: |
          umask 077
          mkdir -p "$HOME/.cranium"
          if [ -e "$HOME/.cranium/mcuboot_signing_key.pem" ]; then
            echo "::error::A signing key is already here, and this job must only ever have its own."
            exit 1
          fi
          python3 "$ZEPHYR_BASE/../bootloader/mcuboot/scripts/imgtool.py" keygen -t ecdsa-p256 -k "$HOME/.cranium/mcuboot_signing_key.pem"

      # The compiler's cache from the last run on main, which the toolchain's ccache picks up by itself.
      # Unlike the SDK's cache it holds build output, and a restore may be any earlier one: that is
      # acceptable because nothing built here is ever installed. Every image of this job is signed
      # with a throwaway key that no board accepts, and releases are built and signed on a person's
      # machine. A pull request can read main's cache and cannot write to it.
      - name: Restore the compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.configuration }}-${{ env.NCS_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.configuration }}-${{ env.NCS_VERSION }}-

      - name: Build
        run: |
          export CCACHE_DIR="$HOME/.ccache" CCACHE_MAXSIZE=400M
          arguments=()
          if [ -n "$CMAKE_ARGS" ]; then arguments=(-- "$CMAKE_ARGS"); fi
          cd "$HOME/ncs"
          west build -d "$GITHUB_WORKSPACE/build" -b "$BOARD" --sysbuild --pristine=always "$GITHUB_WORKSPACE/firmware/app" "${arguments[@]}"
          ccache --show-stats || true

      - name: Save the compiler cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.configuration }}-${{ env.NCS_VERSION }}-${{ github.run_id }}

      # An image that does not verify against this job's key is not from this job.
      - name: Check the image and report its size
        id: report
        if: matrix.configuration == 'default'
        run: |
          imgtool="$ZEPHYR_BASE/../bootloader/mcuboot/scripts/imgtool.py"
          python3 "$imgtool" verify -k "$HOME/.cranium/mcuboot_signing_key.pem" binaries/latest.signed.bin
          if python3 "$imgtool" verify -k firmware/keys/fw_signing_pub.pem binaries/latest.signed.bin; then
            echo "::error::This image verifies against the project's own key. CI must never have that key."
            exit 1
          fi
          # From 1.9.0 every release can also be sent from a phone (docs/mobile-apps.md).
          if ! grep -qx 'CONFIG_APP_BT_OTA=y' build/app/zephyr/.config; then
            echo "::error::The default configuration has lost firmware update over Bluetooth."
            exit 1
          fi
          python3 -I tools/build_report.py --build build --repo . \
            --summary "$GITHUB_STEP_SUMMARY" --artifact ci-artifact --output "$GITHUB_OUTPUT"

      - name: Check that the build without Bluetooth has none
        if: matrix.configuration == 'no Bluetooth'
        run: |
          if grep -qx 'CONFIG_APP_BT_OTA=y' build/app/zephyr/.config || grep -qx 'CONFIG_BT=y' build/app/zephyr/.config; then
            echo "::error::no_bt_sysbuild.conf did not turn Bluetooth off."
            exit 1
          fi
          test -s build/app/zephyr/zephyr.signed.bin
          test -d build/netcore_blinky
          {
            echo "## Firmware build without Bluetooth"
            echo
            echo "It compiled and linked, with the blinky on the network core. No artifact is kept."
          } >> "$GITHUB_STEP_SUMMARY"

      # The default's checks, on the files that tools/store_binary.py keeps for this board type, and
      # what makes it an nRF5340 DK's image: Bluetooth only, the Bluetooth controller on the network
      # core, and its board type and flash layout in the signed TLVs, which a board and the console
      # check before they take it. The link has already been checked for Wi-Fi and cloud code
      # (firmware/app/bt_only_check.py).
      - name: Check the nRF5340 DK's image and report its size
        id: report_nrf5340dk
        if: matrix.configuration == 'nRF5340 DK'
        run: |
          image=binaries/latest-nrf5340dk.signed.bin
          config=build/app/zephyr/.config
          imgtool="$ZEPHYR_BASE/../bootloader/mcuboot/scripts/imgtool.py"
          python3 "$imgtool" verify -k "$HOME/.cranium/mcuboot_signing_key.pem" "$image"
          if python3 "$imgtool" verify -k firmware/keys/fw_signing_pub.pem "$image"; then
            echo "::error::This image verifies against the project's own key. CI must never have that key."
            exit 1
          fi
          for setting in CONFIG_APP_BT_ONLY=y CONFIG_APP_BT_OTA=y CONFIG_APP_BT_STATIC_PASSKEY=y; do
            if ! grep -qx "$setting" "$config"; then
              echo "::error::The nRF5340 DK's build does not have $setting."
              exit 1
            fi
          done
          if grep -qE '^CONFIG_(WIFI|AWS_IOT|APP_LOCATION|MEMFAULT)=y$' "$config"; then
            echo "::error::The nRF5340 DK's build has Wi-Fi, AWS IoT, the location or Memfault in it."
            exit 1
          fi
          test -s build/hci_ipc/zephyr/zephyr.hex
          board=$(python3 -I tools/check_image.py --board "$image")
          layout=$(python3 -I tools/check_image.py --layout "$image")
          if [ "$board" != nrf5340dk ] || [ "$layout" != 1 ]; then
            echo "::error::The image says board type \"$board\" and flash layout \"$layout\" (TLVs 0xA1 and 0xA2), not nrf5340dk and 1."
            exit 1
          fi
          echo "Board type $board and flash layout $layout, from TLVs 0xA1 and 0xA2."
          python3 -I tools/build_report.py --build build --repo . \
            --summary "$GITHUB_STEP_SUMMARY" --artifact ci-artifact --output "$GITHUB_OUTPUT"

      - name: Remove the throwaway key
        if: always()
        run: rm -f "$HOME/.cranium/mcuboot_signing_key.pem"

      - name: Upload the image, which cannot be installed
        if: matrix.configuration == 'default'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.report.outputs.artifact }}
          path: ci-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the nRF5340 DK's image, which cannot be installed either
        if: matrix.configuration == 'nRF5340 DK'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.report_nrf5340dk.outputs.artifact }}
          path: ci-artifact/
          if-no-files-found: error
          retention-days: 30

  # A release of firmware, tagged v<version>. The phone apps' tags (android-v, ios-v) are released by
  # release-apps.yml, and a GitHub release made for one of those tags has no files to check here.
  release-assets:
    name: Check the release's files
    if: >-
      github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'android-v') &&
      !startsWith(github.event.release.tag_name, 'ios-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Read-only, like the whole workflow: this job can look at a release and cannot change it.
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Download the release's files
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?$ ]]; then
            echo "::error::This tag does not look like v1.6.0 or v1.6.0+2."
            exit 1
          fi
          mkdir "$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"
      - name: Check the signature, the version and SHA256SUMS
        run: scripts/verify-github-release.sh "$TAG" "$RUNNER_TEMP/release"
