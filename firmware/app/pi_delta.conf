#
# Raspberry Pi delta updates, from 1.20.0 (docs/pi-delta-update.md): an SD card in SPI mode holds a
# mirror of the Pi's image, which a "pi_delta" job brings up to date by downloading only the blocks
# that changed; the Pi takes them over its SPI link. Added to the application by sysbuild.cmake when
# SB_CONFIG_APP_PI_DELTA is set, as pi_delta_sysbuild.conf does:
#
#   west build -b nrf7002dk/nrf5340/cpuapp/ns --sysbuild firmware/app -- -DSB_EXTRA_CONF_FILE=pi_delta_sysbuild.conf
#   scripts/firmware/build.sh --pi
#

CONFIG_APP_PI_DELTA=y

# The card: Zephyr's SD host over SPI (the "sdhc0" node), and its disk, in raw sectors. No file system.
CONFIG_DISK_ACCESS=y
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
# The SD stack's and the SD host's warnings and errors, without their notes (power up and down, the
# clock, a legacy card): 176 bytes of flash, toward the heartbeat's card report. The application logs
# the card itself ("Pi image card: ...").
CONFIG_SD_LOG_LEVEL_WRN=y
CONFIG_SDHC_LOG_LEVEL_WRN=y

# The ECDSA check of the manifest's header, on the public key alone.
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
