#
# nRF5340 DK, application core, non-secure target (TF-M in the secure domain). Bluetooth only: this
# board has no Wi-Fi chip. Read with prj_bt_only.conf, in that order: see CMakeLists.txt.
#
# The flash and RAM layout, the bootloader, TF-M and the signing are those of the nRF7002 DK
# (boards/nrf7002dk_nrf5340_cpuapp_ns.conf), so that the same tools and the same slot size hold.
#

# General
CONFIG_HW_STACK_PROTECTION=y
# Device identity: the SoC's factory-programmed 64-bit identifier
CONFIG_HWINFO=y
CONFIG_HW_ID_LIBRARY_SOURCE_DEVICE_ID=y

# What an image for this board is compatible with ("Compatibility" in docs/fleet.md), board type
# nrf5340dk and flash layout 1, in its protected TLVs 0xA1 and 0xA2: CONFIG_APP_BOARD_TYPE,
# CONFIG_APP_IMAGE_LAYOUT and the imgtool arguments come from firmware/app/Kconfig, by the board, and a
# .conf cannot set the first two. flash_layouts.json holds these partitions as its layout 1.

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# External flash (MX25R64 on QSPI, where the nRF7002 DK has its Wi-Fi chip) holds the secondary image
# slot. 4 KiB erase blocks in the application as well as in the bootloader, so that erasing never
# reaches past the end of the slot.
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16

# Bootloader support in the application
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_USE_ALL_AVAILABLE_RAM=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
# MCUboot is built with downgrade prevention.
CONFIG_MCUBOOT_BOOTLOADER_NO_DOWNGRADE=y

# TF-M. The stored passkey goes into its protected storage (src/bt/bt_passkey.c), which is on by default.
CONFIG_TFM_PROFILE_TYPE_SMALL=y

# Network core: release it from reset, for the Bluetooth controller (hci_ipc). As on the nRF7002 DK,
# the RTC synchronisation service between the cores is not needed.
CONFIG_SOC_NRF53_CPUNET_ENABLE=y
CONFIG_NRF53_SYNC_RTC=n
