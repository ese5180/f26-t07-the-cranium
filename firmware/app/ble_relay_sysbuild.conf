# The Bluetooth relay (docs/ble-relay.md): the nRF7002 DK's default build, Bluetooth and all, plus
# ble_relay.conf. Build with
#   scripts/firmware/build.sh --keep --no-upload --without-key --cmake-arg -DSB_EXTRA_CONF_FILE=ble_relay_sysbuild.conf
# Not for the nRF5340 DK.
SB_CONFIG_APP_BT_OTA=y
SB_CONFIG_NETCORE_HCI_IPC=y
SB_CONFIG_APP_BLE_RELAY=y
