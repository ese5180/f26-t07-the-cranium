#
# MCUboot on the nRF5340 DK: drive the MX25R64 external flash that holds the secondary slot. On this
# board it is on QSPI, which the nRF7002 DK gives to its Wi-Fi chip.
#
# Based on nRF Connect SDK v3.4.0
# samples/matter/light_bulb/sysbuild/mcuboot/boards/nrf5340dk_nrf5340_cpuapp.conf
# (Copyright (c) 2023 Nordic Semiconductor ASA, LicenseRef-Nordic-5-Clause).
#

CONFIG_FLASH=y
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=0

CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16

CONFIG_BOOT_ERASE_PROGRESSIVELY=y
CONFIG_SOC_FLASH_NRF_EMULATE_ONE_BYTE_WRITE_ACCESS=y

# No golden image on this board. The one that is frozen, 1.5.0, is an nRF7002 DK's, and no image for
# this board has been frozen yet. tools/golden.py freeze writes the pin into the shared prj.conf, so this
# line has to go, and the pin be this board's own, before this bootloader may have one.
CONFIG_CRANIUM_GOLDEN=n
