#
# Sysbuild settings shared by every image.
#

SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_PARTITION_MANAGER=n
# The nRF70 Wi-Fi driver: Kconfig.sysbuild turns it on for every board but the nRF5340 DK, which has
# no Wi-Fi chip. It was set here up to 1.12.0, which a board without the chip cannot build with.

# Images are signed with this project's own ECDSA P-256 key. The private key is kept
# outside the repository, in the home directory of whoever builds a release: create it
# with `python tools/keys.py generate` (or obtain the team key). Without this option
# the build would fall back to MCUboot's published debug key, which anyone can sign with.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\$ENV{HOME}/.cranium/mcuboot_signing_key.pem"

# Swap with revert: a new image runs once in "test" state and the bootloader puts the
# previous image back unless the application confirms it.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# Firmware update over Bluetooth LE, from 1.9.0 in every build, so that each release can be sent
# from a phone as well (docs/mobile-apps.md). The Bluetooth host only starts after a person
# holds Button 1 for 5 s. The network core runs the Bluetooth controller, and it is flashed over
# the debug port only: a board that still has the blinky there gets Wi-Fi updates as before,
# and its Button 1 hold says that the controller is missing. no_bt_sysbuild.conf leaves it out.
SB_CONFIG_APP_BT_OTA=y
SB_CONFIG_NETCORE_HCI_IPC=y
