#
# Cranium application-core image for a board with Bluetooth and no Wi-Fi: the nRF5340 DK. Used in
# place of prj.conf, which is about Wi-Fi and AWS IoT (CMakeLists.txt picks it by the board). The
# board's own settings are in boards/nrf5340dk_nrf5340_cpuapp_ns.conf, and Bluetooth's in bt_ota.conf,
# which sysbuild applies to every build. See "The nRF5340 DK (Bluetooth only)" in firmware/README.md.
#
# What is the same as in prj.conf is the same on purpose: keep the two in step.
#

# Diagnostics
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_HW_ID_LIBRARY=y

# Heap and stacks. bt_ota.conf sets the heap, for an nRF7002 DK's Wi-Fi and TLS; this board has far
# more RAM free than it needs.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# No network stack, no AWS IoT, no downloader, no job parser and no events to the console.
CONFIG_APP_BT_ONLY=y
CONFIG_APP_CLOUD_EVENTS=n

# Buttons (Bluetooth, factory reset) and the hardware watchdog
CONFIG_INPUT=y
CONFIG_WATCHDOG=y

# ---------------------------------------------------------------------------------
# Development and provisioning build: the serial console (src/console.h). It is also the only place a
# person can see a passkey on a board without a stored one, so a build with Bluetooth needs it.
# ---------------------------------------------------------------------------------
CONFIG_APP_CONSOLE=y
# The console owns uart0, and logs go through it. Nothing else may print there. The
# second line overrides what the board's defaults say.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
