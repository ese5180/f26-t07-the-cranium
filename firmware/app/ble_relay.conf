#
# The Bluetooth relay (src/bt/ble_relay.h, docs/ble-relay.md), from 1.21.0. Added after bt_ota.conf by
# sysbuild.cmake when ble_relay_sysbuild.conf sets SB_CONFIG_APP_BLE_RELAY.
#
CONFIG_APP_BLE_RELAY=y
# An L2CAP channel that the board gives credits for itself, so that what a phone sends lands in one small
# ring and not in SDU-sized buffers (bt_l2cap_chan_ops.seg_recv, marked experimental in the SDK).
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_SEG_RECV=y
# Only for the DNS hook, which is off unless a connection goes over the relay: no socket is offloaded.
# The board's own configuration sets it to n, as the SDK sample does.
CONFIG_NET_SOCKETS_OFFLOAD=y
# RAM: the relay takes about 3.5 KB, and the default build has about 1.8 KB free. This build gives back the
# 4 KB that bt_ota.conf adds to the kernel heap for Bluetooth (44240, down to the 40144 of a build without
# it). Whether the heap still holds with Wi-Fi, Bluetooth and TLS all running is for the hardware test
# (HEAP on the console); it is the owner's call (docs/ble-relay.md, "Decisions for the owner").
CONFIG_HEAP_MEM_POOL_SIZE=40144
