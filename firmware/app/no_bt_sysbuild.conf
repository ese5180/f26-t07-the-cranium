#
# A build without firmware update over Bluetooth LE, as every build was before 1.9.0:
#
#   west build -b nrf7002dk/nrf5340/cpuapp/ns --sysbuild firmware/app -- -DSB_EXTRA_CONF_FILE=no_bt_sysbuild.conf
#
# The network core gets the blinky back. A board running an image like this ignores a Button 1
# hold, and a phone cannot update it until a cloud update brings Bluetooth back.
#

SB_CONFIG_APP_BT_OTA=n
SB_CONFIG_NETCORE_BLINKY=y
