#
# A build for a board wired to a Raspberry Pi, from 1.15.0 (docs/pi-ota.md): Pi image updates
# through the SD card and SPI, and no firmware update over Bluetooth LE, whose RAM it takes:
#
#   west build -b nrf7002dk/nrf5340/cpuapp/ns --sysbuild firmware/app -- -DSB_EXTRA_CONF_FILE=pi_ota_sysbuild.conf
#   scripts/build.sh --pi
#
# As with no_bt_sysbuild.conf, the network core gets the blinky back, and a phone cannot update a
# board running an image like this until a cloud update brings Bluetooth back.
#

SB_CONFIG_APP_BT_OTA=n
SB_CONFIG_NETCORE_BLINKY=y
SB_CONFIG_APP_PI_OTA=y
