#
# Raspberry Pi images, from 1.15.0 (docs/pi-ota.md): downloaded onto a microSD card in SPI mode,
# then sent over the same SPI bus to the Pi. Added to the application by sysbuild.cmake when
# SB_CONFIG_APP_PI_OTA is set, as pi_ota_sysbuild.conf does:
#
#   west build -b nrf7002dk/nrf5340/cpuapp/ns --sysbuild firmware/app -- -DSB_EXTRA_CONF_FILE=pi_ota_sysbuild.conf
#
# The download is the firmware's own downloader (fota_download) with a custom DFU target, which
# writes to the card: no second downloader, no third TLS session, and no RAM for either. It still
# takes about 9 KiB of RAM, and the default build has about 1 KiB left, so a build with this has no
# Bluetooth (docs/pi-ota.md, "Memory").
#

CONFIG_APP_PI_OTA=y

# The card: Zephyr's SD host over SPI (the "sdhc0" node), its disk, and FatFS with 8.3 names only.
CONFIG_SDMMC_STACK=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FS_FATFS_LFN=n
CONFIG_FS_FATFS_MKFS=n
# The image and the record: no more are open at once.
CONFIG_FS_FATFS_NUM_FILES=2
CONFIG_FS_FATFS_NUM_DIRS=1

# The ECDSA check of a Pi image's manifest, on the public key alone.
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
