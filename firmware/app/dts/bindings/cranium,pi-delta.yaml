# The pins of Raspberry Pi delta updates (docs/pi-delta-update.md) that are not an SPI bus's own. READY
# to the Pi is the message link's (pi-ready-gpios in the board's overlay, docs/pi-link.md).

description: Raspberry Pi delta updates, the board's pins

compatible: "cranium,pi-delta"

properties:
  cd-gpios:
    type: phandle-array
    description: |
      The SD slot's card-detect switch, an input, active when a card is in.
