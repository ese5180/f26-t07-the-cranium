#
# Firmware update over Bluetooth LE. From 1.9.0 this is what sysbuild.conf sets anyway, so
# giving this file changes nothing; it is kept so that older commands still work. See
# no_bt_sysbuild.conf for a build without it, and "Firmware update over Bluetooth" in
# firmware/README.md.
#

SB_CONFIG_APP_BT_OTA=y
SB_CONFIG_NETCORE_HCI_IPC=y
