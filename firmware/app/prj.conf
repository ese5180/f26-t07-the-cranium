#
# Cranium application-core image: settings that do not depend on the board.
# Board specifics (Wi-Fi, TF-M, bootloader, flash) are in boards/.
#
# Based on nRF Connect SDK v3.4.0 samples/net/aws_iot/prj.conf
# (Copyright (c) 2020 Nordic Semiconductor ASA, LicenseRef-Nordic-5-Clause).
#

# Diagnostics
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_HW_ID_LIBRARY=y

# Heap and stacks (the board file raises these for Wi-Fi and TLS)
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_CONNECTION_MANAGER=y
# The driver's Kconfig sets 16 only along with its recovery, and the default is 5. Named here so that
# a fault image built without the recovery has the same queue as every other image.
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# AWS IoT. The endpoint and the thing name are provisioned per device at run time and
# kept in secure storage, so no account-specific value is built into the image.
CONFIG_AWS_IOT=y
CONFIG_AWS_IOT_AUTO_DEVICE_SHADOW_REQUEST=n

# MQTT over TLS only (port 8883). Credentials live under this security tag.
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_HELPER_SEC_TAG=201
# From 1.14.0 a jobs message is read on this thread, as it arrives (cloud.h), so it has 512 bytes
# more than the 4096 it had.
CONFIG_MQTT_HELPER_STACK_SIZE=4608
CONFIG_MQTT_HELPER_PAYLOAD_BUFFER_LEN=4096
CONFIG_MQTT_HELPER_RX_TX_BUFFER_SIZE=512
CONFIG_MQTT_KEEPALIVE=120
CONFIG_MQTT_CLEAN_SESSION=y
# No last-will message: the device policy in AWS IoT allows publishing to the device's
# own shadow and jobs topics only, and a connection that announces any other topic is
# refused.
CONFIG_MQTT_HELPER_LAST_WILL=n

# Never compile certificates or keys into the firmware. With this option on, the device
# private key would be part of every OTA image stored in the cloud.
CONFIG_MQTT_HELPER_PROVISION_CERTIFICATES=n

# JSON parsing of job documents
CONFIG_CJSON_LIB=y

# Buttons (update confirmation, factory reset) and the hardware watchdog
CONFIG_INPUT=y
CONFIG_WATCHDOG=y

# Firmware download over HTTPS into the secondary slot. The application drives this
# itself instead of using the aws_fota library, which starts downloading without
# asking, reports success before the new image has run, and checks neither the
# version nor a digest.
CONFIG_AWS_FOTA=n
CONFIG_FOTA_DOWNLOAD=y
CONFIG_FOTA_DOWNLOAD_PROGRESS_EVT=y
CONFIG_FOTA_CLIENT_AUTOSCHEDULE_UPDATE=n
CONFIG_FOTA_DOWNLOAD_BUF_SZ=4096
CONFIG_DFU_TARGET=y
CONFIG_DFU_TARGET_MCUBOOT=y
CONFIG_DOWNLOADER=y
CONFIG_DOWNLOADER_STACK_SIZE=4096
# Presigned download URLs are long.
CONFIG_DOWNLOADER_MAX_FILENAME_SIZE=2048
# Never follow a redirect: it could lead to another host or to plain HTTP.
CONFIG_DOWNLOADER_MAX_REDIRECTS=0

# ---------------------------------------------------------------------------------
# Memfault, from 1.14.0 (docs/memfault.md). The board never connects to Memfault: src/mflt/mflt.c
# sends the SDK's chunks on its AWS IoT connection, so there is no HTTP client, no third TLS
# session and no project key in the image. CONFIG_APP_MEMFAULT turns that part on.
# ---------------------------------------------------------------------------------
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_HTTP_ENABLE=n
CONFIG_MEMFAULT_NCS_PROVISION_CERTIFICATES=n
# Memfault's device is the AWS thing name, set when the board starts (mflt_init()). The version
# and the hardware come from firmware/app/Kconfig: "1.14.0+0" and the board type.
CONFIG_MEMFAULT_NCS_DEVICE_ID_RUNTIME=y
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
# The coredump of the last crash, in RAM that no image initialises, at the same address in every
# image from 1.14.0 (MFLT_COREDUMP and MFLT_REBOOT in boards/*.overlay), so that it outlives a
# revert. 3,968 bytes: the registers, the stack that crashed and the threads, and no data or bss.
# A coredump that does not fit is cut short at the end, which is the threads that did not crash:
# 128 bytes of the top of each stack leaves room for more of them.
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP=y
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP_SIZE=3968
CONFIG_MEMFAULT_COREDUMP_STACK_SIZE_TO_COLLECT=128
CONFIG_MEMFAULT_COREDUMP_ACTIVE_TASK_STACK_SIZE_TO_COLLECT=256
# About nine threads fit after that, so the SDK need not keep track of more than 16 of the 28.
CONFIG_MEMFAULT_COREDUMP_MAX_TRACKED_TASKS=16
# Heartbeats and events wait here until they are sent: one heartbeat and a few events fit.
CONFIG_MEMFAULT_EVENT_STORAGE_SIZE=768
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP_REGION="MFLT_COREDUMP"
CONFIG_MEMFAULT_REBOOT_TRACKING_REGION="MFLT_REBOOT"
CONFIG_MEMFAULT_COREDUMP_COLLECT_DATA_REGIONS=n
# The reset cause has one reader, src/reset_cause.c, which clears it: Memfault gets it from there.
CONFIG_MEMFAULT_REBOOT_REASON_GET_CUSTOM=y
# Restarts for being stuck and a factory reset, by name (config/memfault_reboot_reason_user_config.def).
CONFIG_MEMFAULT_REBOOT_REASON_CUSTOM_ENABLE=y
# Off: the SDK's Wi-Fi metrics also send the access point's OUI, which docs/fleet.md does not let
# a board send anywhere. src/mflt/mflt.c keeps the same metrics, by the same names, without it.
CONFIG_MEMFAULT_METRICS_WIFI=n
# Zephyr's default metrics, from 1.15.0: the SDK's default set (CPU use, cpu_usage_pct, and the
# timer thread's stack) and the stack use of the idle thread and the system work queue need the
# stacks filled at their start, which costs boot time and no RAM. The heap's and the connection's
# metrics were on already.
CONFIG_INIT_STACKS=y
# Off: NCS's own stack metrics need the thread analyzer, the heap's allocation log costs RAM, and the
# Bluetooth metrics are for a phone that stays connected, which here it never does for long.
CONFIG_MEMFAULT_NCS_STACK_METRICS=n
CONFIG_MEMFAULT_HEAP_STATS=n
CONFIG_MEMFAULT_METRICS_BLUETOOTH=n
# The SDK turns on thread names for its coredumps, 32 bytes in every thread by default.
CONFIG_THREAD_MAX_NAME_LEN=16

# ---------------------------------------------------------------------------------
# Development and provisioning build: the serial console (src/console.h). A release
# build turns it off with -Dapp_CONFIG_APP_CONSOLE=n.
# ---------------------------------------------------------------------------------
CONFIG_APP_CONSOLE=y
# The console owns uart0, and logs go through it. Nothing else may print there. The
# second line overrides what the board's defaults say.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# On-device key generation and certificate signing request
CONFIG_MBEDTLS_X509_CREATE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
