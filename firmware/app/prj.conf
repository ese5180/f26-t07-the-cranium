#
# Cranium application-core image: settings that do not depend on the board.
# Board specifics (Wi-Fi, TF-M, bootloader, flash) are in boards/.
#
# Based on nRF Connect SDK v3.4.0 samples/net/aws_iot/prj.conf
# (Copyright (c) 2020 Nordic Semiconductor ASA, LicenseRef-Nordic-5-Clause).
#

# Diagnostics
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_HW_ID_LIBRARY=y

# Heap and stacks (the board file raises these for Wi-Fi and TLS)
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_CONNECTION_MANAGER=y

# AWS IoT. The endpoint and the thing name are provisioned per device at run time and
# kept in secure storage, so no account-specific value is built into the image.
CONFIG_AWS_IOT=y
CONFIG_AWS_IOT_AUTO_DEVICE_SHADOW_REQUEST=n

# MQTT over TLS only (port 8883). Credentials live under this security tag.
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_HELPER_SEC_TAG=201
CONFIG_MQTT_HELPER_STACK_SIZE=4096
CONFIG_MQTT_HELPER_PAYLOAD_BUFFER_LEN=4096
CONFIG_MQTT_HELPER_RX_TX_BUFFER_SIZE=512
CONFIG_MQTT_KEEPALIVE=120
CONFIG_MQTT_CLEAN_SESSION=y

# Never compile certificates or keys into the firmware. With this option on, the device
# private key would be part of every OTA image stored in the cloud.
CONFIG_MQTT_HELPER_PROVISION_CERTIFICATES=n
