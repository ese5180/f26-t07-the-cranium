#
# The border router: Wi-Fi station on the nRF7002 DK, and Zephyr's OpenThread border router with Wi-Fi as its
# backbone. Added to the application by sysbuild.cmake when SB_CONFIG_CRANIUM_BORDER_ROUTER is on, which it is
# by default on the nRF7002 DK. Matter stays on Thread: Wi-Fi is the border router's link, not a Matter transport.
#
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
# The nRF70's firmware patches are read from external flash (boards/nrf70_patch_partitions.dtsi), not kept in
# the application.
CONFIG_NRF_WIFI_PATCHES_EXT_FLASH_STORE=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# IP on both sides, routing between them.
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_ROUTE_MCAST=y
CONFIG_NET_SOCKETS_SERVICE=y
CONFIG_NET_CONTEXT_RECV_PKTINFO=y
CONFIG_NET_CONTEXT_RECV_HOPLIMIT=y
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_MAX_MCAST_ROUTES=10
CONFIG_NET_SOCKETS_INET_RAW=y

# Zephyr's OpenThread border router, cut to what this board needs: routing between Thread and Wi-Fi over IPv6, and
# the SRP advertising proxy with mDNS on Wi-Fi (a laptop finds the Matter devices). Left out to save memory: IPv4
# and NAT64, TCP, the border agent and OpenThread's own commissioner (this board is the Matter commissioner),
# TREL, DHCPv6 prefix delegation, upstream DNS
# (src/br/br_unused.c).
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER=y
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER_VENDOR_NAME="Cranium"
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER_BASE_SERVICE_NAME="Cranium-BorderRouter"
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER_MODEL_NAME="Cranium"
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER_IPV4=n
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER_NAT64_TRANSLATOR=n
CONFIG_OPENTHREAD_BORDER_ROUTER=y
CONFIG_OPENTHREAD_BORDER_ROUTING=y
# Needed by OpenThread's routing manager in this SDK, which does not build without it.
CONFIG_OPENTHREAD_BORDER_ROUTING_COUNTERS=y
CONFIG_OPENTHREAD_NETDATA_PUBLISHER=y
# Zephyr's border router code forwards multicast through OpenThread's backbone router.
CONFIG_OPENTHREAD_BACKBONE_ROUTER=y
CONFIG_OPENTHREAD_BACKBONE_ROUTER_MULTICAST_ROUTING=y
CONFIG_OPENTHREAD_SRP_ADV_PROXY=y
CONFIG_OPENTHREAD_DNSSD_DISCOVERY_PROXY=y
CONFIG_OPENTHREAD_MULTICAST_DNS=y
CONFIG_OPENTHREAD_PLATFORM_UDP=y
CONFIG_OPENTHREAD_INTERFACE_EARLY_UP=y
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_MAX_STATECHANGE_HANDLERS=3
CONFIG_OPENTHREAD_IP6_FRAGM=y
CONFIG_OPENTHREAD_ECDSA=y
CONFIG_OPENTHREAD_TREL=n
CONFIG_OPENTHREAD_NAT64_TRANSLATOR=n

# Room in flash: the supplicant logs errors only and leaves out WEP, which no network should still use.
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_ERR=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_WEP=n

# Buffers sized for one backbone link and a home's Thread network, not the defaults.
CONFIG_NET_PKT_RX_COUNT=12
CONFIG_NET_PKT_TX_COUNT=12
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_NRF70_RX_NUM_BUFS=8
CONFIG_NRF70_MAX_TX_AGGREGATION=4
CONFIG_NRF70_MAX_TX_TOKENS=5
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER_MSG_POOL_NUM=4
# The Wi-Fi driver's packet heap, sized for the buffers above rather than its 130 KB default.
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=60000
# WPA2 only: a WPA2/WPA3 network accepts WPA2 stations.
CONFIG_WIFI_NM_WPA_SUPPLICANT_WPA3_IMPLEMENTATION_NONE=y
