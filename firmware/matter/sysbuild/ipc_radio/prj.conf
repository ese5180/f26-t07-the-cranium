#
# The network core: Bluetooth LE controller and 802.15.4 radio together (Kconfig.sysbuild turns both on), with
# no console of its own.
#
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_TIMESLICE_SIZE=0
# Two links: a phone sending an update (peripheral) and a device being commissioned (central).
CONFIG_BT_MAX_CONN=2
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
