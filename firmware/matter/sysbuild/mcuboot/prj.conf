#
# MCUboot for the Matter variant: the team's ECDSA P-256 key (sysbuild.conf), swap with revert, no serial
# recovery and no golden image (those are the main image's bootloader, firmware/app/sysbuild/mcuboot).
#
CONFIG_PM=n
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_BOOT_BOOTSTRAP=n
CONFIG_BOOT_ENCRYPT_IMAGE=n
CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=y
CONFIG_BOOT_ERASE_PROGRESSIVELY=y
CONFIG_SOC_FLASH_NRF_EMULATE_ONE_BYTE_WRITE_ACCESS=y
CONFIG_FLASH=y
CONFIG_FPROTECT=y
CONFIG_WIFI_NRF70=n
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=0
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_CBPRINTF_NANO=y
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_RESET_ON_FATAL_ERROR=n
