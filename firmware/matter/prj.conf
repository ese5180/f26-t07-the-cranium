#
# The Matter variant, common to both boards (docs/matter-thread.md). border_router.conf adds Wi-Fi and the
# border router on the nRF7002 DK. The Matter commissioner is this project's own C code (src/matter/), built on
# the PSA crypto API: no connectedhomeip, no mbedTLS X.509.
#

# Bluetooth LE: central for commissioning (BTP over the device's CHIPoBLE service), peripheral for updates.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_DEVICE_NAME="Cranium"

# Thread: a full device that forms the network and leads it, with the SRP and DNS-SD server the devices
# register with. OpenThread's heap is the system heap: on its own small one the SRP server starts with no
# domain and refuses every registration.
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_EXTERNAL_HEAP=y
CONFIG_OPENTHREAD_SRP_SERVER=y
CONFIG_OPENTHREAD_ENABLE_SERVICE=y
CONFIG_OPENTHREAD_DNSSD_SERVER=y
CONFIG_OPENTHREAD_DNS_CLIENT=y
CONFIG_OPENTHREAD_MAX_CHILDREN=10
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# Crypto for the commissioner, through PSA: SPAKE2+ as the prover (PASE), P-256 ECDSA and ECDH (CASE, the
# fabric's certificates, attestation), HKDF, AES-CCM, PBKDF2 and SHA-256.
CONFIG_PSA_CRYPTO_DRIVER_OBERON=y
CONFIG_PSA_WANT_ALG_SPAKE2P_MATTER=y
CONFIG_PSA_WANT_KEY_TYPE_SPAKE2P_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_PBKDF2_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
# This board as a device: the PASE verifier (w0 || L from the passcode).
CONFIG_PSA_WANT_KEY_TYPE_SPAKE2P_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_SPAKE2P_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_SPAKE2P_KEY_PAIR_EXPORT=y

# Its own update over Matter: the image goes into MCUboot's second slot.
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# The fabric's root key and the board's operational key are persistent PSA keys, kept by trusted storage in
# settings. Without a hardware unique key in use, their storage key comes from a hash of the key ID: not
# protected against someone reading the flash.
CONFIG_MBEDTLS_PSA_CRYPTO_STORAGE_C=y
CONFIG_TRUSTED_STORAGE=y
CONFIG_TRUSTED_STORAGE_BACKEND_AEAD_KEY_HASH_UID=y
CONFIG_TRUSTED_STORAGE_STORAGE_BACKEND_SETTINGS=y

# Storage, console and shell.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SHELL=y
# Long enough for tools/matter_ota_upload.py's chunks of an OTA image.
CONFIG_SHELL_CMD_BUFF_SIZE=600
CONFIG_LOG=y
# Warnings and errors only from the stacks; this project's modules log their own progress.
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_REBOOT=y
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_DK_LIBRARY=y
