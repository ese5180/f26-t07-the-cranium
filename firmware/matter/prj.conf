#
# The Matter variant, common to both boards (docs/matter-thread.md). boards/<board>.conf adds Wi-Fi and the
# border router on the nRF7002 DK.
#

# C++ and the Matter stack, with the controller library (needs firmware/matter/sdk/patch_sdk.py).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_CONTROLLER=y
CONFIG_CHIP_ENABLE_READ_CLIENT=y
CONFIG_CHIP_MAX_FABRICS=2
CONFIG_CHIP_PERSISTENT_SUBSCRIPTIONS=n
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=n
CONFIG_CHIP_LIB_SHELL=y
# The Matter test vendor and a test product ID: this is not a certified product.
CONFIG_CHIP_DEVICE_VENDOR_ID=65521
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Cranium commissioner"
# No factory data partition: the stack's built-in test DAC (Matter test certificates) stands in.
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_TASK_STACK_SIZE=16384
CONFIG_CHIP_MALLOC_SYS_HEAP_SIZE=40960

# Bluetooth LE: central for commissioning, peripheral for updates from a phone.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_DEVICE_NAME="Cranium"

# Thread: a full device that forms the network and leads it, with the SRP and DNS-SD server the devices
# register with. OpenThread's heap is the system heap: on its own small one the SRP server starts with no
# domain and refuses every registration.
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_EXTERNAL_HEAP=y
CONFIG_OPENTHREAD_SRP_SERVER=y
CONFIG_OPENTHREAD_ENABLE_SERVICE=y
CONFIG_OPENTHREAD_DNSSD_SERVER=y
CONFIG_OPENTHREAD_MAX_CHILDREN=10
CONFIG_OPENTHREAD_PLATFORM_KEY_REF=n

# Crypto. The commissioner is the SPAKE2+ prover, which the Oberon driver implements; it parses the devices'
# certificates, which a Matter device build never does.
CONFIG_CHIP_CRYPTO_PSA=y
CONFIG_PSA_CRYPTO_DRIVER_OBERON=y
CONFIG_PSA_WANT_ALG_SPAKE2P_MATTER=y
CONFIG_PSA_WANT_KEY_TYPE_SPAKE2P_KEY_PAIR_IMPORT=y
CONFIG_CHIP_CRYPTO_USE_X509=y
CONFIG_MBEDTLS_X509_LIBRARY=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_MBEDTLS_HEAP_SIZE=12288

# Storage, console and shell.
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_REBOOT=y
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_DK_LIBRARY=y
