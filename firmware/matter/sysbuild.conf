#
# Sysbuild settings of the Matter variant (docs/matter-thread.md).
#
SB_CONFIG_MATTER=y
SB_CONFIG_PARTITION_MANAGER=n
SB_CONFIG_BOOTLOADER_MCUBOOT=y
# The team's signing key, as in firmware/app/sysbuild.conf; it stays outside the repository.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\$ENV{HOME}/.cranium/mcuboot_signing_key.pem"
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
# The application image only; the network core is flashed over the debug port.
SB_CONFIG_SECURE_BOOT_NETCORE=n
SB_CONFIG_NETCORE_APP_UPDATE=n
