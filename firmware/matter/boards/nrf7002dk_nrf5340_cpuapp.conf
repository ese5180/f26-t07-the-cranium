#
# The nRF7002 DK. Without SB_CONFIG_CRANIUM_BORDER_ROUTER it runs as the nRF5340 DK does: commissioner and Thread
# leader, no Wi-Fi. border_router.conf adds Wi-Fi and the border router.
#
# External flash on SPI, as in the main image.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
