#
# The nRF7002 DK: Wi-Fi station and the Thread border router with Wi-Fi as its backbone. Matter itself stays
# on Thread (CHIP_WIFI off): Wi-Fi is the border router's link, not a Matter transport.
#
CONFIG_CHIP_WIFI=n
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=n

# External flash on SPI, as in the main image.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# IP on both sides, routing between them.
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_ROUTE_MCAST=y
CONFIG_NET_SOCKETS_SERVICE=y
CONFIG_NET_CONTEXT_RECV_PKTINFO=y
CONFIG_NET_CONTEXT_RECV_HOPLIMIT=y
CONFIG_NET_IPV6_NBR_CACHE=y
CONFIG_NET_MAX_MCAST_ROUTES=10
CONFIG_NET_SOCKETS_INET_RAW=y

# Zephyr's OpenThread border router, cut to what a home network needs: routing, the SRP advertising proxy and
# mDNS on Wi-Fi, the border agent. Left out to save memory: NAT64, TREL, DHCPv6 prefix delegation, upstream DNS.
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER=y
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER_VENDOR_NAME="Cranium"
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER_BASE_SERVICE_NAME="Cranium-BorderRouter"
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER_MODEL_NAME="Cranium"
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER_IPV4=n
CONFIG_OPENTHREAD_ZEPHYR_BORDER_ROUTER_NAT64_TRANSLATOR=n
CONFIG_OPENTHREAD_BORDER_ROUTER=y
CONFIG_OPENTHREAD_BORDER_ROUTING=y
CONFIG_OPENTHREAD_BORDER_AGENT=y
CONFIG_OPENTHREAD_BORDER_AGENT_ID=y
CONFIG_OPENTHREAD_BORDER_AGENT_MESHCOP_SERVICE=y
CONFIG_OPENTHREAD_NETDATA_PUBLISHER=y
CONFIG_OPENTHREAD_BACKBONE_ROUTER=y
CONFIG_OPENTHREAD_BACKBONE_ROUTER_MULTICAST_ROUTING=y
CONFIG_OPENTHREAD_SRP_ADV_PROXY=y
CONFIG_OPENTHREAD_DNSSD_DISCOVERY_PROXY=y
CONFIG_OPENTHREAD_MULTICAST_DNS=y
CONFIG_OPENTHREAD_PLATFORM_UDP=y
CONFIG_OPENTHREAD_INTERFACE_EARLY_UP=y
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_MAX_STATECHANGE_HANDLERS=3
CONFIG_OPENTHREAD_DUA=y
CONFIG_OPENTHREAD_MLR=y
CONFIG_OPENTHREAD_IP6_FRAGM=y
CONFIG_OPENTHREAD_ECDSA=y
CONFIG_OPENTHREAD_TREL=n
CONFIG_OPENTHREAD_NAT64_TRANSLATOR=n
